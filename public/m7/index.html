<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>المهمة السابعة</title>
<meta name="theme-color" content="#090d1c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Chakra+Petch:wght@600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: mission-control screen — HUD (brand · mission · timer) over a mission stage, with a 4-lane relay track along the bottom. Phone view is a stacked remote. */
:root{
  --ink:#090d1c; --ink2:#10172e; --ink3:#18213f; --line:#27325c;
  --fg:#eef1ff; --mute:#8e98c6;
  --sig:#ffb21e; --hot:#ff3b5c;
  --t1:#ff4d5e; --t2:#3ea6ff; --t3:#2fd47b; --t4:#b67cff;
  --display:'Lalezar','IBM Plex Sans Arabic',system-ui,sans-serif;
  --body:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --num:'Chakra Petch','IBM Plex Sans Arabic',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;
  background-image:radial-gradient(1200px 600px at 85% -10%, #1b2a66 0%, transparent 60%),radial-gradient(900px 500px at 0% 110%, #3a1430 0%, transparent 60%),repeating-linear-gradient(0deg, transparent 0 39px, #ffffff06 39px 40px),repeating-linear-gradient(90deg, transparent 0 39px, #ffffff06 39px 40px);
  background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--sig);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.disp{font-family:var(--display);font-weight:400;letter-spacing:0}

/* ---------- gate ---------- */
.gate{min-height:100vh;display:grid;place-items:center;padding-block:32px}
.gate-in{max-width:760px;width:100%;display:grid;gap:28px;text-align:center}
.gate h1{font-family:var(--display);font-size:clamp(56px,13vw,120px);line-height:1;margin:0;text-wrap:balance}
.gate h1 b{color:var(--sig);font-family:var(--num)}
.gate p{color:var(--mute);margin:0 auto;max-width:52ch}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.choice{background:var(--ink2);border:1px solid var(--line);border-radius:18px;padding:24px;text-align:right;display:grid;gap:6px;transition:transform .15s,border-color .15s}
.choice:hover{transform:translateY(-3px);border-color:var(--sig)}
.choice strong{font-family:var(--display);font-size:30px;font-weight:400}
.choice span{color:var(--mute);font-size:14px}
.choice .ico{font-family:var(--num);font-size:13px;color:var(--sig);letter-spacing:.12em}
.share{display:grid;grid-template-columns:auto 1fr;gap:18px;text-align:right;background:var(--ink2);border:1px solid var(--line);border-radius:18px;padding:16px}
.qrbox{display:grid;justify-items:center;gap:4px;text-align:center}
.qrbox #qrP{background:#eef1ff;padding:10px;border-radius:12px;line-height:0}
.qrbox #qrP img,.qrbox #qrP canvas{display:block;max-width:100%}
.qrbox b{font-family:var(--display);font-size:20px;font-weight:400}.qrbox span{font-size:13px;color:var(--mute)}
.links{display:grid;gap:8px;min-width:0;align-content:start}
.lk{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center;background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.lk b{font-size:14px}.lk.host b{color:var(--sig)}
.lk .u{direction:ltr;font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
@media (max-width:640px){.share{grid-template-columns:1fr}.lk{grid-template-columns:1fr auto}.lk .u{grid-column:1 / -1;grid-row:2}}
.joinqr{position:absolute;bottom:0;inset-inline-start:0;z-index:3;display:grid;justify-items:center;gap:4px;background:var(--ink2);border:1px solid var(--line);border-radius:16px;padding:10px}
.joinqr #qrJ{background:#eef1ff;padding:6px;border-radius:8px;line-height:0}
.joinqr span{font-size:13px;color:var(--mute)}
.howto{background:#ffb21e14;border:1px dashed #ffb21e66;border-radius:14px;padding:14px 18px;font-size:14px;text-align:right;color:var(--fg)}

/* ---------- screen ---------- */
.scr{min-height:100vh;display:grid;grid-template-rows:auto auto 1fr auto;gap:14px;padding-block:14px 18px}
.hud{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand .disp{font-size:clamp(26px,3vw,40px);line-height:1}
.brand .seven{font-family:var(--num);font-weight:700;color:var(--ink);background:var(--sig);border-radius:8px;padding:0 10px;font-size:clamp(22px,2.6vw,34px);line-height:1.25}
.mchip{display:flex;flex-direction:column;line-height:1.25;padding-inline-start:18px;border-inline-start:2px solid var(--line);min-width:0}
.mchip small{color:var(--sig);font-family:var(--num);letter-spacing:.14em;font-size:13px}
.mchip span{font-family:var(--display);font-size:clamp(22px,2.4vw,34px)}
.hud .sp{flex:1}
.tools{display:flex;gap:8px}
.tbtn{border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px;color:var(--mute);background:var(--ink2)}
.tbtn:hover{color:var(--fg);border-color:var(--mute)}
.tbtn.on{color:var(--ink);background:var(--sig);border-color:var(--sig)}
.clock{font-family:var(--num);font-weight:700;font-size:clamp(54px,7.5vw,128px);line-height:.9;letter-spacing:.02em;font-variant-numeric:tabular-nums;direction:ltr}
.clock.warn{color:var(--sig)}
.clock.danger{color:var(--hot);animation:throb 1s infinite}
.clock.idle{color:var(--mute)}
@keyframes throb{0%,100%{transform:scale(1)}50%{transform:scale(1.07);text-shadow:0 0 30px #ff3b5c99}}
.tbar{height:8px;background:var(--ink3);border-radius:99px;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--hot),var(--sig));border-radius:99px;transition:width .25s linear;margin-inline-start:auto}
.stage{min-height:0;position:relative}
.timesup{position:absolute;inset:0;display:grid;place-items:center;z-index:5;pointer-events:none}
.timesup b{font-family:var(--display);font-size:clamp(60px,12vw,190px);color:var(--hot);background:#090d1cdd;padding:10px 48px;border-radius:24px;border:3px solid var(--hot);transform:rotate(-4deg);animation:stamp .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{from{transform:scale(2.4) rotate(-4deg);opacity:0}to{transform:scale(1) rotate(-4deg);opacity:1}}

/* panel basics */
.panel{display:grid;gap:18px;animation:rise .45s ease-out}
@keyframes rise{from{transform:translateY(14px);opacity:.2}to{transform:none;opacity:1}}
.kicker{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{font-size:13px;border-radius:99px;padding:3px 12px;border:1px solid var(--line);color:var(--mute);background:var(--ink2)}
.pill.sig{color:var(--ink);background:var(--sig);border-color:var(--sig);font-weight:700}
.goal{font-size:clamp(18px,1.6vw,24px);margin:0;max-width:60ch}
.scoreline{color:var(--mute);font-size:14px}
.card{background:var(--ink2);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.big-q{font-family:var(--display);font-size:clamp(32px,4.6vw,76px);line-height:1.25;margin:0;text-wrap:balance}
.ans{display:inline-flex;align-items:center;gap:14px;background:var(--sig);color:var(--ink);border-radius:14px;padding:8px 22px;font-family:var(--display);font-size:clamp(28px,3.6vw,56px);animation:stamp .45s cubic-bezier(.2,1.6,.4,1)}
.ans small{font-family:var(--body);font-size:15px;font-weight:700;opacity:.8}
.counter{font-family:var(--num);color:var(--sig);font-size:15px;letter-spacing:.14em}

/* case */
.case{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.suspects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sus{position:relative;overflow:hidden}
.sus h4{margin:0;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.2}
.sus .role{color:var(--sig);font-size:13px}
.sus p{margin:6px 0 0;font-size:15px}
.sus.culprit{border-color:var(--hot);box-shadow:0 0 0 2px var(--hot) inset}
.sus.culprit::after{content:"اللص";position:absolute;top:14px;left:-6px;font-family:var(--display);font-size:30px;color:var(--hot);border:3px solid var(--hot);border-radius:10px;padding:0 14px;transform:rotate(-12deg);background:#090d1ccc;animation:stamp .5s cubic-bezier(.2,1.6,.4,1)}
.sus.cleared{opacity:.45}
.clues{display:grid;gap:10px;align-content:start}
.clue{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.clue .n{font-family:var(--num);font-weight:700;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--sig);color:var(--ink)}
.clue.locked{border-style:dashed;color:var(--mute)}
.clue.locked .n{background:var(--ink3);color:var(--mute)}
.clue.fresh{animation:rise .5s ease-out, glow 2s ease-out}
@keyframes glow{from{box-shadow:0 0 0 3px var(--sig)}to{box-shadow:0 0 0 0 transparent}}

/* cipher */
.abc{display:flex;flex-wrap:wrap;gap:4px;direction:rtl}
.abc span{display:grid;place-items:center;width:36px;height:40px;border-radius:8px;background:var(--ink3);font-size:20px;font-weight:700}
.abc span:nth-child(odd){background:#1f2a52}
.cmsgs{display:grid;gap:14px}
.cmsg{display:grid;gap:4px}
.cmsg .lbl{color:var(--mute);font-size:14px}
.cmsg .code{font-family:var(--display);font-size:clamp(38px,5.4vw,84px);line-height:1.15;letter-spacing:.06em;color:var(--fg);text-shadow:0 0 22px #3ea6ff66}
.cmsg.gold .code{color:var(--sig);text-shadow:0 0 22px #ffb21e66}

/* memory */
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:820px;width:100%;margin-inline:auto;position:relative}
.mcell{aspect-ratio:1.25;max-width:100%;border-radius:16px;background:var(--ink2);border:1px solid var(--line);display:grid;place-items:center;align-content:center;gap:2px;font-size:clamp(34px,4.5vw,64px);line-height:1}
.mcell small{font-size:14px;color:var(--mute);font-family:var(--body)}
.mcover{position:absolute;inset:0;border-radius:16px;background:var(--ink2);border:2px dashed var(--sig);display:grid;place-items:center;text-align:center;align-content:center;gap:6px}
.mcount{font-family:var(--num);font-size:clamp(60px,8vw,120px);color:var(--sig);line-height:1}

/* charades */
.turn{display:grid;gap:10px;justify-items:start}
.turn .who{font-family:var(--display);font-size:clamp(48px,8vw,130px);line-height:1}
.turn .tclock{font-family:var(--num);font-size:clamp(40px,5vw,80px);font-weight:700;direction:ltr}
.cwrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%}
.cw{display:grid;gap:2px;justify-items:center;padding-block:10px}
.cw b{font-family:var(--num);font-size:42px;line-height:1}
.cw.active{border-color:var(--sig);box-shadow:0 0 0 2px var(--sig) inset}

/* intro */
.intro{display:grid;gap:26px;align-content:center;min-height:100%;position:relative;overflow:hidden;padding-block:10px}
.intro .huge7{position:absolute;inset-inline-start:-2%;top:50%;transform:translateY(-50%);font-family:var(--num);font-weight:700;font-size:clamp(260px,46vw,720px);line-height:.8;color:transparent;-webkit-text-stroke:2px #ffb21e40;pointer-events:none;user-select:none}
.intro h2{font-family:var(--display);font-weight:400;margin:0;font-size:clamp(60px,10vw,170px);line-height:.95;position:relative;text-wrap:balance;animation:glitch 4s infinite}
@keyframes glitch{0%,92%,100%{text-shadow:none;transform:none}93%{text-shadow:4px 0 var(--t1),-4px 0 var(--t2);transform:translateX(3px)}95%{text-shadow:-4px 0 var(--t3),4px 0 var(--t4);transform:translateX(-3px)}97%{text-shadow:none;transform:none}}
.intro p{font-size:clamp(18px,1.8vw,26px);margin:0;max-width:44ch;position:relative}
.roadmap{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;position:relative}
.rm{background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:2px;min-width:0}
.rm .counter{font-size:12px}
.rm b{font-family:var(--display);font-weight:400;font-size:19px;line-height:1.2}
.rm small{color:var(--mute);font-size:12px}
.rm.last{border-color:var(--sig);background:#ffb21e14}

/* board & winner */
.board{display:grid;gap:14px;align-content:center;min-height:100%}
.brow{display:grid;grid-template-columns:52px minmax(120px,240px) 1fr 110px;gap:14px;align-items:center}
.brow .rk{font-family:var(--num);font-size:34px;color:var(--mute);text-align:center}
.brow .nm{font-family:var(--display);font-size:clamp(26px,3vw,44px);line-height:1.1;min-width:0}
.brow .bar{height:44px;background:var(--ink3);border-radius:12px;overflow:hidden}
.brow .bar i{display:block;height:100%;border-radius:12px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.brow .sc{font-family:var(--num);font-size:38px;font-weight:700;text-align:left}
.brow:first-child .rk{color:var(--sig)}
.winner{display:grid;justify-items:center;align-content:center;text-align:center;gap:10px;min-height:100%;position:relative}
.winner .crown{font-family:var(--num);color:var(--sig);letter-spacing:.3em;font-size:18px}
.winner .wn{font-family:var(--display);font-size:clamp(80px,15vw,260px);line-height:1;animation:stamp .8s cubic-bezier(.2,1.6,.4,1)}
.winner .ws{font-family:var(--num);font-size:clamp(30px,4vw,64px)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}

/* race */
.race{display:grid;gap:8px;background:#10172ecc;border:1px solid var(--line);border-radius:18px;padding:12px 16px}
.race-h{display:flex;justify-content:space-between;color:var(--mute);font-size:13px}
.lane{display:grid;grid-template-columns:minmax(110px,190px) 1fr 96px;gap:14px;align-items:center}
.lane .tn{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:clamp(20px,1.8vw,28px);line-height:1.1;min-width:0}
.lane .tn i{width:12px;height:12px;border-radius:4px;flex:none}
.lane .tn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane .ts{font-family:var(--num);font-weight:700;font-size:clamp(26px,2.4vw,38px);text-align:left;line-height:1}
.lane.lead .ts{color:var(--sig)}
.track{position:relative;display:grid;grid-template-columns:repeat(7,1fr);align-items:center;height:40px}
.track::before{content:"";position:absolute;inset-inline:calc(100%/14);top:50%;height:3px;transform:translateY(-50%);background:var(--line);border-radius:3px}
.node{position:relative;justify-self:center;width:22px;height:22px;border-radius:50%;background:var(--ink);border:2px solid var(--line);display:grid;place-items:center;font-family:var(--num);font-size:11px;color:var(--mute);z-index:1}
.node.done{background:var(--c);border-color:var(--c);color:var(--ink);font-weight:700}
.node.gold{background:var(--sig);border-color:var(--sig);color:var(--ink);box-shadow:0 0 12px #ffb21e99}
.node.cur{box-shadow:0 0 0 4px #ffb21e44;border-color:var(--sig)}
.runner{position:absolute;top:50%;width:34px;height:34px;margin-inline-start:-17px;transform:translateY(-50%);border-radius:50%;background:var(--c);border:3px solid var(--ink);box-shadow:0 0 0 2px var(--c),0 0 18px var(--c);z-index:2;inset-inline-start:var(--p);transition:inset-inline-start 1.2s cubic-bezier(.3,1.4,.5,1)}

/* flash */
.flash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;pointer-events:none;overflow:hidden}
.flash .sweep{position:absolute;inset:0;background:var(--c);opacity:.92;animation:sweep 3.4s ease-in-out forwards}
.flash .ft{position:relative;text-align:center;color:#0b0f20;animation:fin 3.4s ease-in-out forwards;padding-inline:16px}
.flash .ft b{display:block;font-family:var(--display);font-size:clamp(46px,8vw,140px);line-height:1.05;text-wrap:balance}
.flash .ft span{font-family:var(--num);font-weight:700;font-size:clamp(50px,9vw,160px);line-height:1}
@keyframes sweep{0%{clip-path:inset(0 0 0 100%)}12%{clip-path:inset(0 0 0 0)}85%{clip-path:inset(0 0 0 0);opacity:.92}100%{clip-path:inset(0 100% 0 0);opacity:.92}}
@keyframes fin{0%,8%{transform:scale(.4);opacity:0}18%{transform:scale(1.08);opacity:1}24%{transform:scale(1)}82%{opacity:1}100%{opacity:0;transform:scale(1.2)}}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:45;background:var(--c);color:#0b0f20;border-radius:14px;padding:10px 26px;font-family:var(--display);font-size:clamp(24px,3vw,40px);animation:toast 2.4s ease forwards;white-space:nowrap}
@keyframes toast{0%{transform:translate(-50%,40px);opacity:0}12%,80%{transform:translate(-50%,0);opacity:1}100%{opacity:0;transform:translate(-50%,-20px)}}

/* drawer */
.drawer{position:fixed;inset-block:0;inset-inline-start:0;width:min(440px,100vw);background:var(--ink);border-inline-end:1px solid var(--line);z-index:60;overflow-y:auto;box-shadow:20px 0 60px #0009;padding-block:max(12px,env(safe-area-inset-top,0px)) 40px}

/* ---------- control ---------- */
.ctl{display:grid;gap:14px;padding-block:14px 60px;max-width:640px;margin-inline:auto}
.ctl-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--ink);padding-block:10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.ctl-top .clk{font-family:var(--num);font-weight:700;font-size:40px;line-height:1;direction:ltr}
.ctl-top .meta{flex:1;min-width:0;line-height:1.3}
.ctl-top .meta b{font-family:var(--display);font-weight:400;font-size:22px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conn{font-size:12px;color:var(--mute)}
.conn.ok{color:var(--t3)}
.conn.bad{color:var(--hot)}
.sec{background:var(--ink2);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:12px}
.sec h3{margin:0;font-size:13px;color:var(--mute);font-weight:500;letter-spacing:.04em}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 0}
.b{border-radius:12px;padding:12px 10px;font-weight:700;background:var(--ink3);border:1px solid var(--line);font-size:15px;min-height:48px;transition:transform .08s}
.b:active{transform:scale(.97)}
.b.pri{background:var(--sig);color:var(--ink);border-color:var(--sig)}
.b.hot{background:var(--hot);color:#fff;border-color:var(--hot)}
.b.on{outline:2px solid var(--sig)}
.b:disabled{opacity:.4;cursor:default}
.mchips{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mchips .b{padding:8px 0;font-family:var(--num);font-size:18px;min-height:44px}
.mchips .b.on{background:var(--sig);color:var(--ink);outline:0}
.key{background:#2fd47b14;border:1px dashed #2fd47b88;border-radius:12px;padding:10px 12px;font-size:15px}
.key small{display:block;color:var(--t3);font-size:12px;font-weight:700}
.stepnow{font-size:15px;text-align:center}
.stepnow b{color:var(--sig)}
.word{font-family:var(--display);font-size:46px;text-align:center;background:var(--ink);border-radius:14px;padding:14px;line-height:1.2}
.trow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding-block:8px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow i{width:14px;height:40px;border-radius:5px}
.trow .nm{font-family:var(--display);font-size:22px;line-height:1.1}
.trow .nm small{display:block;font-family:var(--num);font-size:20px;color:var(--sig)}
.trow .acts{display:flex;gap:6px}
.trow .acts .b{min-width:48px;padding:8px 10px;min-height:44px}
.trow .fin.on{background:var(--t3);color:var(--ink);border-color:var(--t3);outline:0}
.amts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.amts .b{padding:8px;min-height:40px;font-family:var(--num)}

/* ================= NETWORK (public MQTT broker, no accounts) ================= */
const BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'];
const TOP=k=>'almohima7/v1/'+ROOMC+'/'+k;
let MC=null,gotState=false;
function pub(k,obj,retain){try{MC&&MC.connected&&MC.publish(TOP(k),JSON.stringify(obj),{qos:1,retain:!!retain})}catch(e){}}
function initNet(bi){
  bi=bi||0;if(!ROOMC)return;
  if(!window.mqtt){conn='bad';paintConn();return}
  conn='wait';paintConn();let ok=false;
  let c;try{c=mqtt.connect(BROKERS[bi],{clientId:'m7_'+CID+'_'+bi,clean:true,keepalive:30,reconnectPeriod:2500,connectTimeout:8000})}catch(e){if(bi+1<BROKERS.length)initNet(bi+1);return}
  MC=c;
  const fail=setTimeout(()=>{if(!ok&&bi+1<BROKERS.length){try{c.end(true)}catch(e){}initNet(bi+1)}},9000);
  c.on('connect',()=>{ok=true;clearTimeout(fail);LIVE=true;conn='ok';paintConn();
    c.subscribe([TOP('state'),TOP('team0'),TOP('team1'),TOP('team2'),TOP('team3')],{qos:1});
    if(pendingDoc&&IS_OWNER){pub('state',pendingDoc,true);pendingDoc=null}
    for(let i=0;i<4;i++)if(tPend[i]){pub('team'+i,tPend[i],true);tPend[i]=null}
    setTimeout(()=>{if(!gotState&&IS_OWNER){const n=structuredClone(S);if(!n.hh)n.hh=hsh(HK);n.sentAt=Date.now();n.writer=CID;S=n;pub('state',n,true);after()}},2500);
  });
  c.on('reconnect',()=>{conn='wait';paintConn()});
  c.on('offline',()=>{conn='bad';paintConn()});
  c.on('close',()=>{if(ok){conn='bad';paintConn()}});
  c.on('message',(topic,buf)=>{
    let d;try{d=JSON.parse(String(buf))}catch(e){return}if(!d||typeof d!=='object'||d.v!==1)return;
    const k=topic.slice(topic.lastIndexOf('/')+1);
    if(k==='state'){
      const init=!gotState;gotState=true;
      if(IS_OWNER&&d.hh&&HK&&d.hh!==hsh(HK)){IS_OWNER=false;canWrite=false}
      if(d.writer===CID)return;
      if(d.sentAt===S.sentAt&&d.writer===S.writer)return;
      if(!init)skew=d.sentAt-Date.now();
      S=d;if(init)lastFlash=S.flash&&S.flash.id;after();
    }else if(/^team[0-3]$/.test(k)){
      const i=+k[4];if(d.writer===CID)return;if(d.sentAt===TD[i].sentAt&&d.writer===TD[i].writer)return;
      const init=!TD[i].sentAt;if(!init)tskew[i]=d.sentAt-Date.now();
      TD[i]=d;if(init)seenLast[i]=d.last&&d.last.id;
      try{localStorage.setItem(SK('teams'),JSON.stringify(TD))}catch(e){}after();
    }
  });
}

function stageHTML(prev){
  if(S.view==='intro')return introHTML();
  if(S.view==='board')return boardHTML();
  if(S.view==='winner')return winnerHTML();
  const m=M[S.mission],s=S.step,r=S.reveal;
  const head=`<div class="kicker"><span class="pill sig">${esc(m.kind)}</span><span class="scoreline">${esc(m.score)}</span></div>`;
  if(m.type==='case'){
    const freshClue=prev.startsWith(`mission|${S.mission}|${s-1}|`)?s:0;
    return `<div class="panel">${head}<p class="goal">${esc(m.goal)}</p>
     <div class="case"><div class="suspects">${m.suspects.map((p,i)=>`<div class="card sus ${r?(i===m.culprit?'culprit':'cleared'):''}"><span class="role">${esc(p.r)}</span><h4>${esc(p.n)}</h4><p>${esc(p.s)}</p></div>`).join('')}</div>
     <div class="clues">${m.clues.map((c,i)=>i<s?`<div class="card clue ${i+1===freshClue?'fresh':''}"><span class="n">${i+1}</span><span>${esc(c)}</span></div>`:`<div class="card clue locked"><span class="n">${i+1}</span><span>دليل مختوم… يُكشف لاحقًا</span></div>`).join('')}
     ${r?`<div class="card" style="border-color:var(--hot)"><b style="color:var(--hot)">الحل:</b> ${esc(m.why)}</div>`:`<p class="note">${esc(m.task)}</p>`}</div></div></div>`;
  }
  if(m.type==='cipher'){
    return `<div class="panel">${head}<p class="goal">${esc(m.goal)}</p>
     <div class="abc" aria-label="الأبجدية">${[...AB].map(c=>`<span>${c}</span>`).join('')}</div>
     <div class="cmsgs">${m.msgs.slice(0,s+1).map(x=>`<div class="cmsg ${x.gold?'gold':''}"><span class="lbl">${esc(x.l)}</span><span class="code">${esc(enc(x.p))}</span>${r?`<span class="ans">${esc(x.p)}</span>`:''}</div>`).join('')}</div>
     <p class="note">${esc(m.task)}</p></div>`;

function tick(){
  const rem=remaining(),t=S.timer,sec=Math.ceil(rem/1000);
  const c=$('#clock');
  if(c){c.textContent=fmt(rem);c.className='clock '+(t.status==='idle'?'idle':sec<=10&&t.status==='running'?'danger':sec<=60?'warn':'');
    const b=$('#tbar');if(b)b.style.width=Math.min(100,rem/t.dur*100)+'%';}
  const cc=$('#cclk');if(cc)cc.textContent=fmt(rem);
  if(t.status==='running'){
    if(lastSec!==null&&sec!==lastSec){if(sec<=10&&sec>0&&ROUTE==='screen')sTick();if(sec===0&&lastSec>0){if(ROUTE==='screen'){sBuzz();showTimesUp()}}}
    lastSec=sec;
  } else lastSec=null;
  // memory countdown
  if(S.view==='mission'&&M[S.mission].type==='memory'&&S.step===1&&!S.reveal){
    const left=Math.max(0,20-Math.floor((Date.now()-memShowAt)/1000));
    const mc=$('#mcount');if(mc&&mc.textContent!==String(left)){mc.textContent=left;if(left>0&&left<=5)sTick()}
    const cv=$('#mcover');if(cv&&left===0&&cv.hidden){cv.hidden=false;sBuzz()}
  }
  const tc=$('#turnClock');
  if(tc){const left=S.turnEnds?Math.max(0,S.turnEnds-skew-Date.now()):75000;const prevTxt=tc.textContent;tc.textContent=fmt(left);
    tc.style.color=S.turnEnds&&left<=10000?'var(--hot)':'';
    if(S.turnEnds&&prevTxt!==tc.textContent){const s2=Math.ceil(left/1000);if(s2<=5&&s2>0)sTick();if(s2===0&&prevTxt!=='00:00')sBuzz()}}
  const ct=$('#cturn');if(ct){const left=S.turnEnds?Math.max(0,S.turnEnds-skew-Date.now()):75000;ct.textContent=fmt(left)}
}
setInterval(tick,200);
function tickTeams(){
  document.querySelectorAll('[data-rt]').forEach(el=>{const i=+el.dataset.rt;const r=tRem(i),on=!!TD[i].startedAt;const t=fmt(r);if(el.textContent!==t)el.textContent=t;el.classList.toggle('live',on);el.classList.toggle('danger',on&&r<=30000)});
  if(ROUTE!=='play'||MYT===null)return;
  const d=TD[MYT],pt=$('#ptimer');
  if(pt){const r=tRem(MYT);pt.textContent=fmt(r);pt.className='pt'+(!d.startedAt?' idle':r<=30000?' danger':'');
    if(d.startedAt&&d.mission<7){const sec=Math.ceil(r/1000);if(sec!==pLastSec){if(sec<=10&&sec>0)sTick();pLastSec=sec}}}
  if(d.startedAt&&d.mission<7&&tRem(MYT)<=0&&toFired!==PS.key){toFired=PS.key;const m=d.mission;sBuzz();
    tcommit(MYT,n=>{if(n.mission!==m||!n.startedAt)return false;n.results[m]={s:'timeout',pts:0,sec:300,first:false,wrong:n.curWrong||0};n.mission=m+1;n.startedAt=0;n.curWrong=0;n.last={id:rid(),mission:m,pts:0,first:false,s:'timeout'}})}
  const sub=PS.sub;
  if(sub&&P[d.mission]&&P[d.mission].type==='memory'&&sub.phase==='show'){
    const left=Math.max(0,Math.ceil((sub.showUntil-Date.now())/1000));const mc=$('#pmem');
    if(mc&&mc.textContent!==String(left)){mc.textContent=left;if(left<=5&&left>0)sTick()}

  }
  const lk=$('#plock');if(lk){const left=Math.ceil((lockUntil-Date.now())/1000);
    if(left>0){if(!lk.firstChild)lk.innerHTML=`<div class="plock"><b>خطأ!</b><p>−10 نقاط · انتظروا</p><span id="plockN">${left}</span></div>`;const n=$('#plockN');if(n&&n.textContent!==String(left))n.textContent=left}
    else if(lk.firstChild)lk.innerHTML=''}
}

function pShake(id){const e=document.getElementById(id)||$('#pmain');if(!e)return;e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake')}
function pFail(sec){
  lockUntil=Date.now()+sec*1000;sBuzz();try{navigator.vibrate&&navigator.vibrate(250)}catch(e){}
  const m=TD[MYT].mission;tcommit(MYT,n=>{if(n.mission!==m)return false;n.curWrong=(n.curWrong||0)+1});
}
function pGood(){sPop();try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}}
function pComplete(bonus){
  const i=MYT,d=TD[i],m=d.mission;if(!d.startedAt||m>=7)return;
  const remS=Math.floor(tRem(i)/1000);
  let pts=Math.max(20,100+Math.floor(remS/3)-10*(d.curWrong||0));if(m===6)pts*=2;pts+=bonus||0;
  const first=!TD.some((t,j)=>j!==i&&t.results[m]&&t.results[m].s==='done');if(first)pts+=30;
  sFan();
  tcommit(i,n=>{if(n.mission!==m||!n.startedAt)return false;n.results[m]={s:'done',pts,sec:300-remS,first,wrong:n.curWrong||0};n.score=(n.score||0)+pts;n.mission=m+1;n.startedAt=0;n.curWrong=0;n.last={id:rid(),mission:m,pts,first,s:'done'}});
}
const PACT={
  pleave:()=>{MYT=null;try{localStorage.removeItem(SK('t'))}catch(e){};PS.key='';$('#app').innerHTML='';after()},
  pteam:v=>{MYT=+v;try{localStorage.setItem(SK('t'),v)}catch(e){};PS.key='';$('#app').innerHTML='';after()},
  pstart:()=>{const m=TD[MYT].mission;tcommit(MYT,n=>{if(n.startedAt||n.mission!==m||!S.raceOn)return false;n.startedAt=Date.now();n.run=rid();n.curWrong=0})},
  'pc-sus':v=>{if(+v===M[0].culprit){PS.sub.stage=1;pGood();pSave();pRender()}else{pShake();pFail(15)}},
  'pc-clue':v=>{const p=PS.sub.pick,k=+v;const j=p.indexOf(k);if(j>=0)p.splice(j,1);else if(p.length<2)p.push(k);pSave();pRender()},
  'pc-ok':()=>{const p=PS.sub.pick.slice().sort().join();if(p==='0,2')pComplete(0);else{PS.sub.pick=[];pSave();pRender();pShake();pFail(15)}},
  'pc-chk':v=>{const i=+v,inp=$('#pci'+i);if(!inp)return;const val=inp.value;PS.sub.val[i]=val;
    if(norm(val)&&norm(val)===norm(M[1].msgs[i].p)){PS.sub.ok[i]=1;pGood();pSave();pRender()}else{pSave();pShake('pcm'+i);pFail(8)}},
  'pc-fin':()=>{if(PS.sub.ok[0]&&PS.sub.ok[1])pComplete(PS.sub.ok[2]?30:0)},
  'pm-open':()=>{PS.sub.phase='show';PS.sub.showUntil=Date.now()+20000;PS.sub.msg='';pSave();pRender()},
  'pm-pick':v=>{const p=PS.sub.picks,k=+v,j=p.indexOf(k);if(j>=0)p.splice(j,1);else p.push(k);pSave();pRender()},
  'pm-sub':()=>{const p=PS.sub.picks,ok=p.filter(k=>k<16).length,bad=p.length-ok;
    if(ok>=10&&bad<=2)pComplete(Math.max(0,ok-10)*5);
    else{PS.sub.phase='ready';PS.sub.picks=[];PS.sub.msg=`تذكرتم ${ok} صحيحة و${bad} خاطئة. تحتاجون 10 صحيحة على الأقل وخطأين كحد أقصى. شاهدوا مرة أخرى.`;PS.sub.order=shuf(PS.sub.order);pSave();pRender();pFail(10)}},
  pq:v=>{const s=PS.sub;if(+v===0){pGood();s.q++;if(s.q>=10){pComplete(0);return}pSave();pRender()}else{pShake();pFail(6)}},
  pt:v=>{const s=PS.sub,k=+v,N=s.round===0?25:28;
    if(k===s.next){const b=$('#tp'+k);b&&b.classList.add('hit');s.next++;beep(500+s.next*25,.07,'triangle',.1);
      if(s.next>=N){if(s.round===0){s.round=1;s.next=0;s.cells=shuf([...Array(28).keys()]);pGood();pSave();pRender()}else pComplete(0);return}
      const n=$('#ptapn');if(n)n.textContent=s.round===0?s.next+1:AB[s.next];pSave()}
    else{const b=$('#tp'+k);if(b){b.classList.add('bad');setTimeout(()=>b.classList.remove('bad'),300)}}},
  pr:v=>{const s=PS.sub;if(+v===0){pGood();s.q++;if(s.q>=5){pComplete(0);return}pSave();pRender()}else{pShake();pFail(10)}},
  'pr-chk':()=>{const s=PS.sub,inp=$('#pri');if(!inp)return;if(digits(inp.value)===RID[s.q].i){pGood();s.q++;if(s.q>=5){pComplete(0);return}pSave();pRender()}else{inp.value='';pShake();pFail(10)}},
  'pv-key':v=>{const s=PS.sub;if(s.code.length<3)s.code+=v;const e=$('#pvd');if(e)e.textContent=s.code;beep(700,.05,'square',.06)},
  'pv-clr':()=>{PS.sub.code='';const e=$('#pvd');if(e)e.textContent='··'},
  'pv-ent':()=>{const s=PS.sub;if(s.code==='31'){s.stage=1;pGood();pSave();pRender()}else{s.code='';pShake('pvd');const e=$('#pvd');if(e)e.textContent='··';pFail(10)}},
  'pv-word':()=>{const s=PS.sub,inp=$('#pvw');if(!inp)return;if(norm(inp.value)===norm('فوز')){s.stage=2;pSave();pRender();sFan();setTimeout(()=>pComplete(0),2600)}else{inp.value='';pShake();pFail(10)}}
};

const ACT={
  newroom:()=>newRoom(),
  lastroom:()=>{let c='';try{c=localStorage.getItem('m7-last')||''}catch(e){}if(c)location.href=location.pathname+'?r='+c},

  snd:()=>{try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume();sound=true;sPop()}catch(e){};renderScreen()},
  fs:()=>{try{const p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();p&&p.catch&&p.catch(()=>{})}catch(e){}},
  drawer:()=>{drawer=!drawer;if(ROUTE==='screen'){renderScreen();if(drawer)renderControl($('#drawerIn'))}},
  mis:v=>commit(n=>{n.view='mission';n.mission=+v;n.step=0;n.reveal=false;n.word=0;n.cw=[0,0,0,0];n.turnEnds=0;n.timer={status:'idle',dur:300000,endsAt:0,rem:300000}}),

  reveal:()=>commit(n=>{n.reveal=!n.reveal}),
  't-start':()=>commit(n=>{const r=n.timer.status==='done'||n.timer.rem<=0?n.timer.dur:n.timer.rem;n.timer={...n.timer,status:'running',endsAt:Date.now()+r,rem:r}}),
  't-pause':()=>commit(n=>{n.timer={...n.timer,status:'paused',rem:Math.max(0,n.timer.endsAt-Date.now())}}),
  't-reset':()=>commit(n=>{n.timer={status:'idle',dur:300000,endsAt:0,rem:300000}}),
  't-add':()=>commit(n=>{if(n.timer.status==='running')n.timer.endsAt+=30000;else n.timer.rem+=30000}),
  amt:v=>{amt=+v;after()},
  add:v=>commit(n=>{const t=n.teams[+v];t.score+=amt;n.flash={id:Math.random().toString(36).slice(2),at:Date.now(),team:+v,big:amt>=100,text:amt>=100?`${t.name} يقفز للأمام!`:`${t.name}  +${amt}`,sub:`+${amt}`}}),
  sub:v=>commit(n=>{n.teams[+v].score-=amt}),

    n.flash={id:Math.random().toString(36).slice(2),at:Date.now(),team:i,big:rank===1,text:rank===1?`${t.name} يحسم المهمة أولًا!`:`${t.name} أنجز · المركز ${rank}  +${pts}`,sub:`+${pts}`}}),
  'cw-ok':()=>commit(n=>{const i=n.step;n.teams[i].score+=10;n.cw[i]++;n.word++;n.flash={id:Math.random().toString(36).slice(2),at:Date.now(),team:i,big:false,text:`صحيحة! ${n.teams[i].name} +10`,sub:'+10'}}),
  'cw-skip':()=>commit(n=>{n.word++}),
  'turn-start':()=>commit(n=>{n.turnEnds=Date.now()+75000}),
  reset:()=>{if(!resetArm){resetArm=1;after();setTimeout(()=>{resetArm=0;after()},3500);return}resetArm=0;const names=S.teams.map(t=>t.name);commit(n=>{const f=fresh();Object.assign(n,f);n.teams.forEach((t,i)=>t.name=names[i])});for(let i=0;i<4;i++)tcommit(i,n=>{Object.assign(n,freshT())});try{localStorage.removeItem(SK('ps'))}catch(e){}}
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const [k,v]=b.dataset.act.split(':');
  if(ROUTE==='play'&&!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();AC.resume();sound=true}catch(err){}}
  if(PACT[k]){
    if(k==='pleave'){PACT.pleave();return}
    if(k!=='pteam'&&(MYT===null||Date.now()<lockUntil))return;
    if(k!=='pteam'&&k!=='pstart'&&!(PS.sub&&pState()==='play'))return;
    PACT[k](v);return;
  }
  if(k==='newroom'||k==='lastroom'||k==='copy'){ACT[k](v);return}
  if(!ROOMC)return;
  if(IS_OWNER===false)return;
  if(k!=='route'&&k!=='snd'&&k!=='fs'&&k!=='drawer'&&k!=='amt'&&!canWrite)return;
  if(sound&&ROUTE==='control')sWhoosh();
  ACT[k]&&ACT[k](v);
});

  if(map[id]){e.preventDefault();const b=document.querySelector(`[data-act="${map[id]}"]`);b&&b.click()}
});
document.addEventListener('toggle',e=>{if(e.target.id==='setDet')detOpen=e.target.open},true);
document.addEventListener('change',e=>{
  const i=e.target.dataset&&e.target.dataset.team;if(i===undefined||!canWrite)return;
  const val=e.target.value.trim().slice(0,18)||DEF_NAMES[+i];e.target.blur();
  commit(n=>{n.teams[+i].name=val});
});

/* ================= CONFETTI ================= */
let cfRAF=0;
function confetti(){
  const c=$('#confetti');c.hidden=false;const x=c.getContext('2d');
  const fit=()=>{c.width=innerWidth;c.height=innerHeight};fit();addEventListener('resize',fit);
  const cols=['#ff4d5e','#3ea6ff','#2fd47b','#b67cff','#ffb21e','#ffffff'];
  const P=Array.from({length:180},()=>({x:Math.random()*c.width,y:-Math.random()*c.height,w:6+Math.random()*8,h:10+Math.random()*10,vy:2+Math.random()*3.5,vx:-1.5+Math.random()*3,r:Math.random()*6,vr:-.1+Math.random()*.2,c:cols[Math.random()*cols.length|0]}));
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  cancelAnimationFrame(cfRAF);
  const loop=()=>{x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;if(p.y>c.height+20){p.y=-20;p.x=Math.random()*c.width}x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});cfRAF=requestAnimationFrame(loop)};
  loop();if(sound)sFan();
}
function stopConfetti(){cancelAnimationFrame(cfRAF);const c=$('#confetti');if(c)c.hidden=true}

/* ================= BOOT ================= */
after();
initNet(0);
</script>
