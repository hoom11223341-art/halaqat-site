<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>وش في بالهم؟</title>
<meta name="description" content="مسابقة وش في بالهم؟ سألنا 100 شخص">
<meta name="theme-color" content="#0d0a24">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marhey:wght@500;700&family=Tajawal:wght@400;500;700;800&family=Bungee&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
/* Layout: game-show stage — marquee-lit answer board (2 columns of flip tiles) with the pot and strikes beside it, team podiums along the bottom. Phones: host remote and team buzzers. */
:root{
  --stage:#0d0a24; --stage2:#17123a; --stage3:#231c52; --line:#3a3170;
  --tile:#0e6a70; --tile2:#0a4e53; --tileface:#fff4dc;
  --brass:#f5c451; --cream:#fff4dc; --mute:#a29cd0; --x:#ff3347;
  --t1:#ff8a3d; --t2:#35c3ff; --t3:#7ee06b; --t4:#ff5fa8;
  --display:'Marhey','Tajawal',system-ui,sans-serif;
  --body:'Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --num:'Bungee','Tajawal',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--stage);color:var(--cream);font-family:var(--body);font-size:16px;line-height:1.6;
  background-image:radial-gradient(ellipse 70% 45% at 50% -8%,#4b2a8a 0%,transparent 70%),radial-gradient(ellipse 40% 60% at 0% 100%,#3b123f 0%,transparent 70%),radial-gradient(ellipse 40% 60% at 100% 100%,#0f3a4a 0%,transparent 70%);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.tbtn{border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px;color:var(--mute);background:var(--stage2)}
.tbtn:hover{color:var(--cream);border-color:var(--mute)}
.tbtn.on{background:var(--brass);color:var(--stage);border-color:var(--brass)}
.note{font-size:13px;color:var(--mute);margin:0}
.chip{font-size:13px;border-radius:99px;padding:2px 12px;border:1px solid var(--line);color:var(--mute)}
.chip.mult{background:var(--brass);color:var(--stage);border-color:var(--brass);font-weight:800}

/* ---------- gate ---------- */
.gate{min-height:100vh;display:grid;place-items:center;padding-block:32px}
.gate-in{max-width:820px;width:100%;display:grid;gap:26px;text-align:center}
.logo{font-family:var(--display);font-weight:700;font-size:clamp(58px,13vw,128px);line-height:1.45;margin:0;color:var(--brass);text-shadow:0 4px 0 #9a6b10,0 10px 30px #f5c45155;transform:rotate(-3deg)}
.logo-sub{font-family:var(--display);font-size:clamp(20px,3vw,30px);color:var(--cream);margin:-6px 0 0}
.gate p{color:var(--mute);margin:0 auto;max-width:54ch}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.choice{background:var(--stage2);border:1px solid var(--line);border-radius:18px;padding:22px;text-align:right;display:grid;gap:4px;transition:transform .15s,border-color .15s}
.choice:hover{transform:translateY(-3px);border-color:var(--brass)}
.choice strong{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.3}
.choice span{color:var(--mute);font-size:14px}
.choice .ico{font-family:var(--num);font-size:12px;color:var(--brass);letter-spacing:.1em}
.share{display:grid;grid-template-columns:auto 1fr;gap:18px;text-align:right;background:var(--stage2);border:1px solid var(--line);border-radius:18px;padding:16px}
.qrbox{display:grid;justify-items:center;gap:4px;text-align:center}
.qrbox #qrP{background:#fff4dc;padding:10px;border-radius:12px;line-height:0}
.qrbox #qrP img,.qrbox #qrP canvas{display:block;max-width:100%}
.qrbox b{font-family:var(--display);font-size:18px}.qrbox span{font-size:13px;color:var(--mute)}
.links{display:grid;gap:8px;min-width:0;align-content:start}
.lk{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center;background:var(--stage);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.lk b{font-size:14px}.lk.host b{color:var(--brass)}
.lk .u{direction:ltr;font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
@media (max-width:640px){.share{grid-template-columns:1fr}.lk{grid-template-columns:1fr auto}.lk .u{grid-column:1 / -1;grid-row:2}}
.joinqr{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-start:calc(16px + env(safe-area-inset-left,0px));z-index:5;display:grid;justify-items:center;gap:4px;background:var(--stage2);border:1px solid var(--line);border-radius:16px;padding:10px}
.joinqr #qrJ{background:#fff4dc;padding:6px;border-radius:8px;line-height:0}
.joinqr span{font-size:13px;color:var(--mute)}
.howto{background:#f5c45114;border:1px dashed #f5c45166;border-radius:14px;padding:14px 18px;font-size:14px;text-align:right}

/* ---------- screen ---------- */
.scr{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;gap:14px;padding-block:14px 18px}
.hud{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:clamp(28px,3vw,44px);color:var(--brass);line-height:1;text-shadow:0 3px 0 #9a6b10;transform:rotate(-2deg)}
.rinfo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-inline-start:16px;border-inline-start:2px solid var(--line)}
.rinfo b{font-family:var(--display);font-size:clamp(18px,2vw,26px);font-weight:500}
.hud .sp{flex:1}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.stage{min-height:0;display:grid;gap:16px;align-content:start;position:relative}
.question{font-family:var(--display);font-weight:700;font-size:clamp(30px,4vw,66px);line-height:1.3;margin:0;text-align:center;text-wrap:balance}
.arena{display:grid;grid-template-columns:minmax(150px,220px) 1fr minmax(150px,220px);gap:18px;align-items:center}
.marquee{position:relative;border-radius:26px;padding:22px;background:linear-gradient(180deg,#1d1648,#120d33);border:3px solid #6d5612;
  box-shadow:0 0 0 6px #120d33,0 0 0 9px #6d5612,0 20px 60px #0009}
.marquee::before{content:"";position:absolute;inset:-15px;border-radius:36px;border:6px dotted var(--brass);pointer-events:none;animation:bulbs .9s steps(1) infinite;filter:drop-shadow(0 0 4px #f5c451aa)}
@keyframes bulbs{50%{border-color:#7a5c14;filter:none}}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:column;grid-template-rows:repeat(4,auto);gap:12px}
.tile{perspective:900px;height:clamp(58px,8.4vh,92px);min-width:0}
.tile-in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,1.5,.5,1);transform-style:preserve-3d}
.tile.open .tile-in{transform:rotateX(180deg)}
.face{position:absolute;inset:0;border-radius:12px;display:flex;align-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.front{background:linear-gradient(180deg,var(--tile),var(--tile2));border:2px solid #1aa0a8;justify-content:center;box-shadow:inset 0 2px 0 #ffffff22}
.front .n{font-family:var(--num);font-size:clamp(24px,3vw,40px);width:1.9em;height:1.4em;display:grid;place-items:center;border-radius:50%;background:#062f33;color:var(--brass);border:2px solid var(--brass)}
.back{transform:rotateX(180deg);background:linear-gradient(180deg,#fffaf0,#f3e3bf);color:#1b1440;border:2px solid var(--brass);justify-content:space-between;padding-inline:18px 0;gap:10px}
.back .t{font-family:var(--display);font-weight:700;font-size:clamp(18px,2.3vw,36px);line-height:1.15;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back .p{font-family:var(--num);font-size:clamp(22px,2.8vw,42px);background:#1b1440;color:var(--brass);height:100%;display:grid;place-items:center;padding-inline:14px;min-width:2.6em}
.tile.empty .front{background:#0b0827;border:2px dashed #2a2260}
.tile.empty .front .n{display:none}
.tile.ghost .back{background:linear-gradient(180deg,#d9d2ef,#bdb3df)}
.pot{display:grid;justify-items:center;gap:4px;text-align:center}
.pot small{color:var(--mute);font-size:14px}
.pot .v{font-family:var(--num);font-size:clamp(44px,6vw,96px);line-height:1;color:var(--brass);text-shadow:0 0 30px #f5c45166}
.pot .v.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25)}}
.strikes{display:flex;gap:8px;justify-content:center;min-height:64px}
.strikes i{font-style:normal;font-family:var(--num);font-size:46px;line-height:1;color:var(--x);width:56px;height:60px;display:grid;place-items:center;border:3px solid var(--x);border-radius:10px;background:#3a0b16;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.strikes i.off{color:#3a3170;border-color:#2b2460;background:none;animation:none}
@keyframes pop{from{transform:scale(2);opacity:0}}
.ttbox{display:grid;gap:6px;width:100%;justify-items:center}
.tt{font-family:var(--num);font-size:clamp(40px,4.4vw,70px);line-height:1;direction:ltr}
.tt.danger{color:var(--x);animation:throb 1s infinite}
.ttbar{width:100%;height:8px;border-radius:99px;background:var(--stage3);overflow:hidden}
.ttbar i{display:block;height:100%;background:var(--brass);border-radius:99px;transition:width .25s linear}
.goal{font-family:var(--display);font-size:clamp(18px,1.8vw,26px);color:var(--mute)}
.goal b{color:var(--t3);font-family:var(--num)}
.playing{font-family:var(--display);font-size:clamp(20px,2vw,30px);line-height:1.2}
.steal{font-family:var(--display);color:var(--x);font-size:26px;animation:blinkx 1s infinite}
@keyframes blinkx{50%{opacity:.35}}
.podiums{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:12px}
.pod{position:relative;background:var(--stage2);border:2px solid var(--line);border-radius:16px 16px 6px 6px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;overflow:hidden;transition:transform .3s,border-color .3s}
.pod::before{content:"";position:absolute;inset:0 0 auto;height:6px;background:var(--c)}
.pod .nm{font-family:var(--display);font-weight:700;font-size:clamp(20px,2.2vw,34px);line-height:1.15;color:var(--c);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .sc{font-family:var(--num);font-size:clamp(28px,3vw,50px);line-height:1}
.pod.on{border-color:var(--c);transform:translateY(-6px);box-shadow:0 0 30px -6px var(--c)}
.pod.lead .sc{color:var(--brass)}
.pod.out{opacity:.35;filter:grayscale(.8)}
.pod.out .nm{text-decoration:line-through}
.pod .sc small{font-family:var(--display);font-size:18px;color:var(--mute)}
.brow.out{opacity:.4}
.brow .tagout{font-family:var(--display);font-size:16px;color:var(--mute);display:block}

/* intro / scores / winner */
.intro{display:grid;justify-items:center;text-align:center;gap:18px;align-content:center;min-height:56vh}
.intro .logo{font-size:clamp(70px,12vw,190px);line-height:1.45;padding-bottom:.08em}
.intro p{font-size:clamp(18px,1.8vw,26px);max-width:46ch;margin:0}
.rounds{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.rounds span{font-family:var(--num);font-size:14px;border-radius:10px;padding:6px 12px;background:var(--stage2);border:1px solid var(--line)}
.rounds span.x2{border-color:var(--t2);color:var(--t2)}.rounds span.x3{border-color:var(--brass);color:var(--brass)}.rounds span.g{background:var(--brass);color:var(--stage)}
.board{display:grid;gap:14px;max-width:1100px;width:100%;margin-inline:auto;align-content:center;min-height:56vh}
.brow{display:grid;grid-template-columns:52px minmax(120px,260px) 1fr 140px;gap:14px;align-items:center}
.brow .rk{font-family:var(--num);font-size:34px;color:var(--mute);text-align:center}
.brow:first-child .rk{color:var(--brass)}
.brow .nm{font-family:var(--display);font-weight:700;font-size:clamp(26px,3vw,46px);line-height:1.1}
.brow .bar{height:46px;background:var(--stage3);border-radius:12px;overflow:hidden}
.brow .bar i{display:block;height:100%;border-radius:12px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.brow .sc{font-family:var(--num);font-size:40px;text-align:left}
.winner{display:grid;justify-items:center;text-align:center;gap:10px;align-content:center;min-height:56vh}
.winner .wn{font-family:var(--display);font-weight:700;font-size:clamp(80px,14vw,230px);line-height:1.05;animation:stamp .8s cubic-bezier(.2,1.6,.4,1)}
.winner .ws{font-family:var(--num);font-size:clamp(30px,4vw,64px)}
@keyframes stamp{from{transform:scale(2.2);opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}

/* golden round */
.gold{display:grid;gap:16px}
.gold-h{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.gold-h .ttl{font-family:var(--display);font-weight:700;font-size:clamp(30px,3.6vw,56px);color:var(--brass);line-height:1}
.gclock{font-family:var(--num);font-size:clamp(50px,6vw,100px);line-height:1;direction:ltr}
.gclock.danger{color:var(--x);animation:throb 1s infinite}
.gclock.idle{color:var(--mute)}
@keyframes throb{50%{transform:scale(1.08)}}
.gcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.gcol{display:grid;gap:10px}
.gcol h3{margin:0;font-family:var(--display);font-size:24px;font-weight:500;color:var(--mute)}
.gcell{display:grid;grid-template-columns:1fr auto;align-items:center;height:clamp(52px,7vh,78px);border-radius:12px;background:linear-gradient(180deg,var(--tile),var(--tile2));border:2px solid #1aa0a8;overflow:hidden}
.gcell .t{font-family:var(--display);font-weight:700;font-size:clamp(18px,2.2vw,32px);padding-inline:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcell .p{font-family:var(--num);font-size:clamp(20px,2.4vw,36px);background:#062f33;color:var(--brass);height:100%;display:grid;place-items:center;min-width:2.8em}
.gcell.cur{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass)}
.gcell.zero .p{color:var(--x)}
.gcell.hide .t,.gcell.hide .p{filter:blur(10px);opacity:.5}
.gcell.fresh{animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.gtot{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
.gtot .v{font-family:var(--num);font-size:clamp(46px,5vw,84px);line-height:1;color:var(--brass)}
.gbar{height:22px;background:var(--stage3);border-radius:99px;overflow:hidden;position:relative}
.gbar i{position:absolute;inset-block:0;inset-inline-start:0;background:linear-gradient(90deg,var(--brass),#ffe7a0);border-radius:99px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.gtot .goal{font-family:var(--num);font-size:24px;color:var(--mute)}
.gwin{font-family:var(--display);font-weight:700;color:var(--brass);font-size:clamp(34px,5vw,80px);text-align:center;animation:stamp .6s cubic-bezier(.2,1.6,.4,1)}

/* flashes */
.fx{position:fixed;inset:0;z-index:50;display:grid;place-items:center;pointer-events:none;overflow:hidden}
.fx .sweep{position:absolute;inset:0;background:var(--c);animation:sweep 2.6s ease-in-out forwards}
.fx .ft{position:relative;text-align:center;color:#120d33;animation:fin 2.6s ease-in-out forwards;padding-inline:16px}
.fx .ft b{display:block;font-family:var(--display);font-weight:700;font-size:clamp(50px,9vw,150px);line-height:1.15;text-wrap:balance}
.fx .ft span{font-family:var(--num);font-size:clamp(40px,7vw,120px);line-height:1}
@keyframes sweep{0%{clip-path:circle(0% at 50% 50%)}15%{clip-path:circle(80% at 50% 50%)}85%{clip-path:circle(80% at 50% 50%);opacity:.94}100%{clip-path:circle(80% at 50% 50%);opacity:0}}
@keyframes fin{0%,6%{transform:scale(.3);opacity:0}18%{transform:scale(1.1);opacity:1}25%{transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:scale(1.15)}}
.bigx{display:flex;gap:2vw}
.bigx i{font-style:normal;font-family:var(--num);font-size:clamp(160px,26vw,420px);line-height:1;color:var(--x);text-shadow:0 0 60px #ff334799;animation:xin 1.6s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes xin{0%{transform:scale(3);opacity:0}15%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0}}

/* drawer */
.drawer{position:fixed;inset-block:0;inset-inline-start:0;width:min(440px,100vw);background:var(--stage);border-inline-end:1px solid var(--line);z-index:60;overflow-y:auto;box-shadow:20px 0 60px #0009;padding-block:max(12px,env(safe-area-inset-top,0px)) 40px}

/* ---------- host remote ---------- */
.ctl{display:grid;gap:12px;padding-block:0 60px;max-width:640px;margin-inline:auto}
.ctl-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--stage);padding-block:10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.ctl-top .pot2{font-family:var(--num);font-size:30px;color:var(--brass);line-height:1;min-width:64px;text-align:center}
.ctl-top .meta{flex:1;min-width:0;line-height:1.3}
.ctl-top .meta b{font-family:var(--display);font-size:19px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conn{font-size:12px;color:var(--mute)}.conn.ok{color:var(--t3)}.conn.bad{color:var(--x)}
.sec{background:var(--stage2);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
.sec h3{margin:0;font-size:13px;color:var(--mute);font-weight:500}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 0}
.b{border-radius:12px;padding:10px;font-weight:800;background:var(--stage3);border:1px solid var(--line);font-size:15px;min-height:48px;transition:transform .08s}
.b:active{transform:scale(.97)}
.b.pri{background:var(--brass);color:var(--stage);border-color:var(--brass)}
.b.hot{background:var(--x);color:#fff;border-color:var(--x)}
.b.on{outline:2px solid var(--brass)}
.b:disabled{opacity:.4;cursor:default}
.rchips{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.rchips .b{padding:6px 0;font-family:var(--num);font-size:16px;min-height:42px}
.rchips .b.on{background:var(--brass);color:var(--stage);outline:0}
.ans{display:grid;gap:6px}
.ab{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;text-align:right;border-radius:12px;padding:10px 12px;background:var(--tile2);border:1px solid #1aa0a8;min-height:52px;font-weight:700;font-size:17px}
.ab .k{font-family:var(--num);color:var(--brass);font-size:15px}
.ab .p{font-family:var(--num);color:var(--brass)}
.ab.done{background:var(--stage3);border-color:var(--line);color:var(--mute);text-decoration:line-through}
.xbtn{font-family:var(--num);font-size:30px;min-height:64px}
.tsel{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px}
.tsel .b{color:#120d33;font-family:var(--display);font-size:17px;min-height:46px;opacity:.55;padding:6px}
.tsel .b.on{opacity:1;outline:3px solid var(--cream)}
.trow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding-block:6px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow i{width:12px;height:36px;border-radius:4px}
.trow .nm{font-family:var(--display);font-size:20px;line-height:1.1}
.trow .nm small{display:block;font-family:var(--num);font-size:18px;color:var(--brass)}
.trow .acts{display:flex;gap:6px}
.trow .acts .b{min-width:46px;padding:6px 10px;min-height:42px}
.buzzst{text-align:center;font-family:var(--display);font-size:22px;border-radius:12px;padding:8px;background:var(--stage)}
.names{display:grid;gap:8px}
.names label{display:grid;grid-template-columns:14px 1fr;gap:10px;align-items:center}

const BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'];
const TOP=k=>'wshfibalhum/v1/'+ROOMC+'/'+k;
let MC=null,gotState=false;
function pub(k,obj,retain){try{MC&&MC.connected&&MC.publish(TOP(k),JSON.stringify(obj),{qos:1,retain:!!retain})}catch(e){}}
function initNet(bi){
  bi=bi||0;if(!ROOMC)return;
  if(!window.mqtt){conn='bad';paintConn();return}
  conn='wait';paintConn();let ok=false;
  let c;try{c=mqtt.connect(BROKERS[bi],{clientId:'wfb_'+CID+'_'+bi,clean:true,keepalive:30,reconnectPeriod:2500,connectTimeout:8000})}catch(e){if(bi+1<BROKERS.length)initNet(bi+1);return}
  MC=c;
  const fail=setTimeout(()=>{if(!ok&&bi+1<BROKERS.length){try{c.end(true)}catch(e){}initNet(bi+1)}},9000);
  c.on('connect',()=>{ok=true;clearTimeout(fail);LIVE=true;conn='ok';paintConn();
    c.subscribe([TOP('state'),TOP('qs'),TOP('buzz')],{qos:1});
    if(pendingDoc&&IS_OWNER){pub('state',pendingDoc,true);pendingDoc=null}
    setTimeout(()=>{if(!gotState&&IS_OWNER){const n=structuredClone(S);if(!n.hh)n.hh=hsh(HK);n.sentAt=Date.now();n.writer=CID;S=n;pub('state',n,true);after()}},2500);
  });
  c.on('reconnect',()=>{conn='wait';paintConn()});
  c.on('offline',()=>{conn='bad';paintConn()});
  c.on('close',()=>{if(ok){conn='bad';paintConn()}});
  c.on('message',(topic,buf)=>{
    let d;try{d=JSON.parse(String(buf))}catch(e){return}if(!d||typeof d!=='object')return;
    const k=topic.slice(topic.lastIndexOf('/')+1);
    if(k==='state'){
      if(d.v!==1)return;const init=!gotState;gotState=true;
      if(IS_OWNER&&d.hh&&HK&&d.hh!==hsh(HK)){IS_OWNER=false;canWrite=false}
      if(d.writer===CID)return;
      if(d.sentAt===S.sentAt&&d.writer===S.writer)return;
      if(!init)skew=d.sentAt-Date.now();
      S=d;if(init)lastFx=S.fx&&S.fx.id;after();
    }else if(k==='qs'){if(d.writer===CID)return;try{localStorage.setItem(SK('q'),JSON.stringify(d))}catch(e){}applyQs(d)}
    else if(k==='buzz'){if(typeof d.id==='string'&&Number.isInteger(d.team))onBuzzSeen(d.id,d.team)}
  });
}

    el.innerHTML=`<div class="gold-h"><div><div class="ttl">الجولة الذهبية</div><div class="note" style="font-size:16px">${g.team!==null?`المتسابق <b style="color:${TC[g.team]}">${esc(S.teams[g.team].name)}</b> · `:''}لاعبان، خمسة أسئلة، والهدف ${GOAL} نقطة</div></div><span class="gclock num" id="gclock">00:20</span></div>
      <div class="gcols">${[0,1].map(p=>`<div class="gcol"><h3>اللاعب ${p===0?'الأول':'الثاني'}</h3>${G.map((_,qi)=>gCell(p,qi)).join('')}</div>`).join('')}</div>
      <div class="gtot"><span class="v num">${sum}</span><div class="gbar"><i style="width:${Math.min(100,sum/GOAL*100)}%"></i></div><span class="goal">${GOAL}</span></div>
      ${sum>=GOAL?`<div class="gwin">وصلتم ${GOAL}! الجائزة الكبرى</div>`:''}`;
    if(old&&!firstPaint){let fresh=false;[0,1].forEach(p=>G.forEach((_,qi)=>{if(old[p][qi]!==g.a[p][qi]&&g.a[p][qi]!==null){fresh=true;const c=el.querySelectorAll('.gcol')[p].querySelectorAll('.gcell')[qi];c&&c.classList.add('fresh')}}));if(fresh)sDing()}
  }
  tickGold();
}
function gRem(){const t=S.g.timer;if(t.status==='running')return Math.max(0,t.endsAt-skew-Date.now());return t.rem}
const fmt=ms=>{const s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
let gLast=null;
function tickGold(){
  const r=gRem(),t=S.g.timer,sec=Math.ceil(r/1000);
  const c=$('#gclock');if(c){c.textContent=fmt(r);c.className='gclock num'+(t.status==='idle'?' idle':t.status==='running'&&sec<=5?' danger':'')}
  const c2=$('#cgclock');if(c2)c2.textContent=fmt(r);
  if(t.status==='running'&&ROUTE==='screen'){if(gLast!==null&&sec!==gLast){if(sec<=5&&sec>0)sTick();if(sec===0)sX()}gLast=sec}else gLast=null;
}
setInterval(()=>{if(S.view==='gold')tickGold()},200);
let ttLast=null,ttFired='';
function tickTT(){
  const t=S.tt||TTI(),r=ttRem(),sec=Math.ceil(r/1000),on=t.status!=='idle'&&S.view==='round';
  const box=$('#ttbox');if(box){box.hidden=!on;const e=$('#tt');if(e){e.textContent=fmt(r);e.className='tt num'+(t.status==='running'&&sec<=10?' danger':'')}const b=$('#ttbar');if(b)b.style.width=(t.dur?Math.min(100,r/t.dur*100):0)+'%'}
  document.querySelectorAll('[data-ttv]').forEach(x=>{x.textContent=on?fmt(r):'--:--'});
  if(t.status==='running'&&ROUTE==='screen'){if(ttLast!==null&&sec!==ttLast&&sec<=5&&sec>0)sTick();ttLast=sec}else ttLast=null;
  /* time up: the host commits (screen as fallback) */
  if(t.status==='running'&&r<=0&&(ROUTE==='control'||ROUTE==='screen')&&ttFired!==String(t.endsAt)&&canWrite&&IS_OWNER!==false){
    const key=String(t.endsAt);const go=()=>{if(!S.tt||S.tt.status!=='running'||String(S.tt.endsAt)!==key)return;ttFired=key;
      commit(n=>{if(!n.tt||n.tt.status!=='running')return false;n.tt=TTI();
        if(hasP(n.stealer)){if(hasP(n.playing)&&n.bank>0&&!n.awarded)doAward(n,n.playing,{failSteal:true});else{n.stealer=null;n.fx=fxN({kind:'timeup',text:'انتهى وقت السرقة!'})}}
        else{n.strikes=3;n.fx=fxN({kind:'timeup',text:'انتهى الوقت!',sub:'فرصة السرقة للباقين'})}})};
    if(ROUTE==='control'||drawer)go();else{ttFired=key;setTimeout(()=>{ttFired='';go()},1500)}
  }
}
setInterval(()=>{if(S.view==='round')tickTT()},250);

function sorted(){return TEAMS().map((t,i)=>({...t,i,out:isOut(i)})).sort((a,b)=>(a.out-b.out)||(b.score-a.score))}
function scoresHTML(){const st=sorted(),max=Math.max(1,...st.map(t=>t.score));
  return `<div class="board">${st.map((t,k)=>`<div class="brow ${t.out?'out':''}"><span class="rk">${t.out?'—':k+1}</span><span class="nm" style="color:${TC[t.i]}">${esc(t.name)}${t.out?'<span class="tagout">خارج المنافسة</span>':''}</span><span class="bar"><i style="width:${Math.max(2,t.score/max*100)}%;background:${TC[t.i]}"></i></span><span class="sc">${t.score}</span></div>`).join('')}</div>`}
function winnerHTML(){const st=sorted(),top=st[0],tie=st.filter(t=>!t.out&&t.score===top.score);
  return `<div class="winner"><span class="chip mult" style="font-size:16px">${tie.length>1?'تعادل في القمة':'المتسابق الفائز'}</span><span class="wn" style="color:${TC[top.i]}">${tie.map(t=>esc(t.name)).join(' و ')}</span><span class="ws">${top.score} نقطة</span>
   <div class="board" style="min-height:0;margin-top:14px;max-width:900px">${st.slice(1).map((t,k)=>`<div class="brow"><span class="rk">${k+2}</span><span class="nm" style="color:${TC[t.i]};font-size:28px">${esc(t.name)}</span><span class="bar" style="height:20px"><i style="width:${Math.max(2,t.score/Math.max(1,top.score)*100)}%;background:${TC[t.i]}"></i></span><span class="sc" style="font-size:28px">${t.score}</span></div>`).join('')}</div></div>`}

/* flashes */
function checkFx(){
  const f=S.fx;if(!f||f.id===lastFx)return;lastFx=f.id;
  if(ROUTE==='buzz'){if(f.kind==='buzz'&&f.team===MYT){try{navigator.vibrate&&navigator.vibrate([80,60,80])}catch(e){}}return}
  if(ROUTE!=='screen')return;
  if(Date.now()-(f.at-skew)>8000)return;
  const fx=$('#fx');
  if(f.kind==='strike'){fx.innerHTML=`<div class="fx"><div class="bigx">${'<i>X</i>'.repeat(f.n)}</div></div>`;sX();setTimeout(()=>{fx.innerHTML=''},1700);return}
  if(f.kind==='dup'){sDup();return}
  if(f.kind==='out'){fx.innerHTML=`<div class="fx" style="--c:#3a3170"><div class="sweep"></div><div class="ft" style="color:#fff4dc"><b style="color:${TC[f.team]}">${esc(S.teams[f.team].name)}</b><span style="font-family:var(--display);font-size:clamp(34px,5vw,80px)">خرج من المنافسة</span></div></div>`;sX();setTimeout(()=>{fx.innerHTML=''},2700);return}
  if(f.kind==='buzz'){fx.innerHTML=`<div class="fx" style="--c:${TC[f.team]}"><div class="sweep"></div><div class="ft"><b>${f.steal?'محاولة سرقة!<br>':''}${esc(S.teams[f.team].name)}</b><span>${f.steal?'يحاولون يسرقون اللوحة':'ضغطوا أولًا!'}</span></div></div>`;sBuzzIn();setTimeout(()=>{fx.innerHTML=''},2700);return}
  if(f.kind==='timeup'){fx.innerHTML=`<div class="fx" style="--c:var(--x)"><div class="sweep"></div><div class="ft" style="color:#fff"><b>${esc(f.text||'انتهى الوقت!')}</b>${f.sub?`<span style="font-family:var(--display);font-size:clamp(30px,4vw,60px)">${esc(f.sub)}</span>`:''}</div></div>`;sX();setTimeout(()=>{fx.innerHTML=''},2700);return}
  if(f.kind==='award'){fx.innerHTML=`<div class="fx" style="--c:${TC[f.team]}"><div class="sweep"></div><div class="ft"><b>${f.steal?'سرقة ناجحة!<br>':f.failSteal?'السرقة فشلت!<br>':f.goal?'حسمها!<br>':''}${esc(S.teams[f.team].name)}</b><span>+${f.pts}</span></div></div>`;sFan();setTimeout(()=>{fx.innerHTML=''},2700);return}
  if(f.kind==='gold'){fx.innerHTML=`<div class="fx" style="--c:var(--brass)"><div class="sweep"></div><div class="ft"><b>الجائزة الكبرى!</b><span>${f.pts}</span></div></div>`;sFan();setTimeout(()=>{fx.innerHTML=''},2700)}
}

  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cols=['#ff8a3d','#35c3ff','#7ee06b','#ff5fa8','#f5c451','#fff4dc'];
  const P=Array.from({length:180},()=>({x:Math.random()*c.width,y:-Math.random()*c.height,w:6+Math.random()*8,h:10+Math.random()*10,vy:2+Math.random()*3.5,vx:-1.5+Math.random()*3,r:Math.random()*6,vr:-.1+Math.random()*.2,c:cols[Math.random()*cols.length|0]}));
  cancelAnimationFrame(cfRAF);
  const loop=()=>{x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;if(p.y>c.height+20){p.y=-20;p.x=Math.random()*c.width}x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});cfRAF=requestAnimationFrame(loop)};
  loop();if(sound)sFan();
}
function stopConfetti(){cancelAnimationFrame(cfRAF);const c=$('#confetti');if(c)c.hidden=true}

after();initNet(0);
</script>
