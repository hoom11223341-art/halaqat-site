<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>رحلة الكنز · جزر المغامرة</title>
<meta name="theme-color" content="#06324a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@400;700;900&family=IBM+Plex+Sans+Arabic:wght@400;700&display=swap">
<style>
:root{--sea1:#04263a;--sea2:#0a4c6e;--sea3:#1584a8;--sand:#f6d98f;--sand2:#e8b95c;--gold:#ffcc33;--coral:#ff6b6b;--leaf:#34c26b;--ink:#062234;--card:#0c3a55;--line:#1f6a8c;--fg:#f3fbff;--mute:#9cc7da;
 --t0:#ff5a5f;--t1:#2fb8ff;--t2:#ffc93c;--t3:#3ee08f}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(120% 80% at 50% 0%,#0d5b82 0%,var(--sea1) 70%) fixed;color:var(--fg);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit}
.disp{font-family:Lalezar,'IBM Plex Sans Arabic',sans-serif;font-weight:400;letter-spacing:0}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.wrap{max-width:720px;margin:0 auto;padding:14px}
.b{background:#0f4566;border:2px solid #2c7ea3;border-radius:14px;padding:10px 16px;font-weight:700;font-size:16px;transition:transform .08s,background .15s}
.b:active{transform:scale(.96)}
.b.pri{background:linear-gradient(180deg,#ffd84d,#f2a91a);border-color:#ffe28a;color:#3a2200}
.b.hot{background:#b8323a;border-color:#ff7b82}
.b.ok{background:#1d8a52;border-color:#5fe39c}
.b.sm{padding:6px 10px;font-size:14px;border-radius:10px}
.b:disabled{opacity:.45;cursor:not-allowed}
.card{background:linear-gradient(165deg,#0f4767,#0a3149);border:2px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 12px 30px #0006,inset 0 1px 0 #ffffff14}
.note{color:var(--mute);font-size:14px;margin:6px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hidden{display:none!important}
/* ---------- landing ---------- */
.land{min-height:100vh;display:grid;place-items:center;padding:20px}
.land .card{max-width:560px;width:100%;text-align:center}
.land h1{font-size:clamp(40px,9vw,72px);margin:4px 0;color:var(--gold);text-shadow:0 4px 0 #8a5200,0 10px 24px #0008}
.land .sub{font-size:18px;color:#d7f0fb}
.land .opts{display:grid;gap:14px;margin-top:18px}
.land input{width:100%;background:var(--ink);border:2px solid var(--line);border-radius:14px;padding:14px;color:var(--fg);font-size:22px;text-align:center;direction:ltr;text-transform:uppercase;letter-spacing:.2em}
.bigemoji{font-size:64px;line-height:1;filter:drop-shadow(0 6px 10px #0007)}
/* ---------- map ---------- */
.map{width:100%;height:auto;display:block;border-radius:24px;border:3px solid #2a89b0;box-shadow:0 16px 40px #0008;background:#0b5a80}
.ship{transition:transform 2.2s cubic-bezier(.45,.05,.3,1)}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}
.wave{animation:wv 6s linear infinite}
@keyframes wv{from{transform:translateX(0)}to{transform:translateX(-80px)}}
.isl-cur .isl-ring{animation:ring 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ring{0%{opacity:.9;transform:scale(.8)}100%{opacity:0;transform:scale(1.5)}}
/* ---------- host ---------- */
.host{padding:16px;display:grid;gap:14px;max-width:1600px;margin:0 auto}
.hbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hbar h1{margin:0;font-size:clamp(28px,3.2vw,48px);color:var(--gold);text-shadow:0 3px 0 #8a5200}
.chip{background:#0a3a55;border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700}
.conn::before{content:'●';margin-inline-end:6px;color:#f5b041}
.conn.ok::before{color:#4ce38a}.conn.bad::before{color:#ff5a5f}
.hgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
@media(max-width:1000px){.hgrid{grid-template-columns:1fr}}
.side{display:grid;gap:12px}
.tcard{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:12px 14px;border-radius:18px;background:#0b3550;border:2px solid var(--line);position:relative;overflow:hidden}
.tcard::before{content:'';position:absolute;inset:0 auto 0 0;width:6px;background:var(--c)}
.tcard .em{font-size:34px;text-align:center}
.tcard .nm{font-weight:700;font-size:19px}
.tcard .st{color:var(--mute);font-size:13px}
.tcard .sc{font-family:Lalezar;font-size:34px;color:var(--gold)}
.tcard .rk{position:absolute;top:6px;left:10px;font-size:12px;color:var(--mute)}
.tcard .tm{font-size:13px;color:#ffe08a}
.tdots{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.tdots i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#0a3a55;border:2px solid var(--line);font-size:12px}
.tdots i.d{background:#1d8a52;border-color:#5fe39c}.tdots i.x{background:#6b2a30;border-color:#ff7b82}.tdots i.n{border-color:var(--gold);box-shadow:0 0 0 3px #ffcc3355;animation:pulse 1.2s infinite}
.banner{text-align:center;font-family:Lalezar;font-size:clamp(22px,2.4vw,38px);color:#fff;min-height:0}
.banner:empty{display:none}
.banner span{display:inline-block;background:linear-gradient(90deg,#0a3a55,#125a80,#0a3a55);border:2px solid var(--gold);border-radius:999px;padding:6px 26px;animation:pop .5s}
@keyframes pop{from{transform:scale(.6);opacity:0}}
body.dispmode .hgrid{grid-template-columns:minmax(0,1fr) 420px}
body.dispmode .tcard .nm{font-size:24px}body.dispmode .tcard .sc{font-size:44px}body.dispmode .tdots i{width:30px;height:30px;font-size:14px}.tdots{flex-wrap:nowrap}
.qrbox{display:grid;place-items:center;gap:8px;text-align:center}
.qrbox #qr{background:#fff;padding:10px;border-radius:14px}
.drawer{position:fixed;inset:0 auto 0 0;width:min(460px,100vw);background:#072a3f;border-inline-start:2px solid var(--line);z-index:50;overflow:auto;padding:16px;box-shadow:0 0 40px #000a;transform:translateX(-105%);transition:transform .25s}
.drawer.on{transform:none}
.sec{background:#0b3550;border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.sec h3{margin:0 0 10px;font-size:17px}
.sec input,.sec textarea{background:var(--ink);border:2px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--fg);width:100%}
.names{display:grid;gap:8px}
.names label{display:grid;grid-template-columns:34px 1fr;align-items:center;gap:8px}
.lk{display:grid;grid-template-columns:40px 110px 1fr;gap:6px;align-items:center;margin-bottom:6px}
.lk input.c{direction:ltr;text-align:center;letter-spacing:.15em}
.adj{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;margin-bottom:6px}
.linkbox{direction:ltr;font-size:12px;background:var(--ink);border:1px dashed var(--line);border-radius:8px;padding:6px;word-break:break-all;margin:6px 0}
/* finale */
.fin{position:fixed;inset:0;z-index:40;background:radial-gradient(circle at 50% 30%,#1a6f94ee,#031b2aee);display:grid;place-items:center;padding:20px;text-align:center}
.fin h2{font-size:clamp(34px,4.6vw,68px);line-height:1.3;margin:0;color:var(--gold);text-shadow:0 5px 0 #8a5200}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin-top:20px;flex-wrap:wrap}
.pod{width:min(220px,40vw);border-radius:20px 20px 8px 8px;padding:14px;background:#0c3a55;border:3px solid var(--c);display:grid;gap:6px;justify-items:center}
.pod .em{font-size:54px}.pod .nm{font-size:22px;font-weight:700}.pod .sc{font-family:Lalezar;font-size:44px;color:var(--gold)}
.pod.p1{transform:translateY(-30px);box-shadow:0 0 50px #ffcc3388}
.chest{font-size:110px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08) rotate(-3deg)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
/* ---------- team ---------- */
.phead{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,#05293dee,#05293dcc);backdrop-filter:blur(6px);padding:10px 14px;border-bottom:2px solid var(--line)}
.phead .r1{display:flex;align-items:center;gap:10px;justify-content:space-between}
.phead .tn{font-weight:700;font-size:18px;display:flex;align-items:center;gap:6px}
.phead .pts{font-family:Lalezar;font-size:26px;color:var(--gold)}
.phead .clk{font-family:Lalezar;font-size:26px;background:#0a3a55;border-radius:12px;padding:0 12px;border:2px solid var(--line)}
.phead .clk.low{color:#ff7b82;border-color:#ff7b82;animation:pulse .8s infinite}
.steps{display:flex;gap:6px;margin-top:8px;justify-content:center}
.steps i{font-style:normal;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#0a3a55;border:2px solid var(--line);font-size:17px}
.steps i.d{background:#1d8a52;border-color:#5fe39c}.steps i.x{background:#6b2a30;border-color:#ff7b82}.steps i.n{border-color:var(--gold);box-shadow:0 0 0 3px #ffcc3344}
.pmain{display:grid;gap:14px;padding:14px;max-width:720px;margin:0 auto}
.ititle{display:flex;align-items:center;gap:12px}
.ititle .ic{font-size:48px}
.ititle h2{margin:0;font-size:32px;color:var(--gold)}
.ititle small{color:var(--mute);display:block}
.intro{font-size:18px;line-height:1.7}
.bigbtn{width:100%;font-size:24px;padding:16px;border-radius:18px}
.sailing{text-align:center;padding:30px 10px}
.sailing .bigemoji{font-size:90px;animation:sail 1.2s ease-in-out infinite}
@keyframes sail{0%,100%{transform:translateX(10px) rotate(-4deg)}50%{transform:translateX(-10px) rotate(4deg)}}
.opts2{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.opt{background:#0f4566;border:2px solid #2c7ea3;border-radius:16px;padding:16px 10px;font-size:20px;font-weight:700;min-height:64px}
.opt.bad{background:#7a2a31;border-color:#ff7b82}
.qtxt{font-size:24px;font-weight:700;line-height:1.5;margin:8px 0 14px;text-align:center}
.prog{height:12px;border-radius:999px;background:#0a3a55;overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ff9d2e);transition:width .3s}
.ctr{display:flex;justify-content:space-between;color:var(--mute);font-size:14px;margin-bottom:6px}
/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{aspect-ratio:1;border-radius:14px;border:2px solid #2c7ea3;background:repeating-linear-gradient(45deg,#0f4c6e 0 10px,#0d4362 10px 20px);font-size:clamp(28px,9vw,44px);display:grid;place-items:center;transition:transform .2s}
.mc span{opacity:0;transition:opacity .15s}
.mc.up{background:#f6e7bf;border-color:var(--sand2);transform:rotateY(0)}
.mc.up span{opacity:1}
.mc.ok{background:#bdf3d2;border-color:#3ee08f}
/* twin */
.tw-orig{display:flex;justify-content:center;gap:16px;align-items:center}
.twc{aspect-ratio:1;border-radius:14px;border:3px solid transparent;position:relative;padding:0;overflow:hidden}
.twc .e{position:absolute;font-size:var(--fs,26px);transform:translate(50%,-50%);line-height:1}
.twg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.twc.bad{border-color:#ff5a5f}
/* tap */
.tapg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tap{font-size:clamp(18px,5.5vw,28px)!important}
.mem.m32{grid-template-columns:repeat(4,1fr);gap:6px}
@media(min-width:620px){.mem.m32{grid-template-columns:repeat(8,1fr)}.tapg{grid-template-columns:repeat(8,1fr)}}
.mem.m32 .mc{font-size:clamp(24px,7vw,36px);border-radius:12px}
.xog{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:360px;margin:0 auto}
.xoc{aspect-ratio:1;border-radius:18px;background:linear-gradient(160deg,#f6e7bf,#e6c98a);border:3px solid #c9a15a;font-size:clamp(40px,14vw,64px);display:grid;place-items:center;box-shadow:inset 0 -5px 0 #0002}
.xoc.vx,.xoc.vo{animation:pop .25s}
.xoc.w{background:linear-gradient(160deg,#fff4b0,#ffcc33);border-color:#fff;box-shadow:0 0 20px #ffcc33aa}
.tap{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7d6,#f2c75c 60%,#c48a1f);border:3px solid #ffe7a1;color:#4a2b00;font-family:Lalezar;font-size:clamp(22px,7vw,34px);display:grid;place-items:center}
.tap.hit{visibility:hidden}
.tap.bad{background:#ff7b82}
/* word search */
.wsg{display:grid;gap:4px;direction:rtl}
.wsc{aspect-ratio:1;border-radius:10px;background:#f6e7bf;color:#3b2a10;font-weight:700;font-size:clamp(20px,6vw,30px);border:2px solid #d8b46a;display:grid;place-items:center;padding:0}
.wsc.sel{background:var(--gold);border-color:#fff}
.wsc.f{background:#8ee6b3;border-color:#2fbf6f}
.wsw{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:10px}
.wsw span{padding:6px 12px;border-radius:999px;background:#0a3a55;border:2px solid var(--line);font-weight:700}
.wsw span.f{background:#1d8a52;border-color:#5fe39c;text-decoration:line-through}
/* keypad */
.disp7{font-family:Lalezar;font-size:44px;text-align:center;letter-spacing:.3em;background:var(--ink);border:3px solid var(--sand2);border-radius:16px;padding:8px;direction:ltr;min-height:76px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;direction:ltr}
.keypad .b{font-size:26px;padding:14px}
.reward{text-align:center}
.reward .coin{font-family:Lalezar;font-size:64px;color:var(--gold);text-shadow:0 4px 0 #8a5200}
.mappiece{margin:14px auto;max-width:320px;background:linear-gradient(135deg,#f6e2b3,#e2bd78);color:#4a2b00;border-radius:12px;padding:16px;border:3px dashed #8a5a1e;transform:rotate(-2deg);box-shadow:0 10px 24px #0007}
.mappiece b{font-family:Lalezar;font-size:72px;display:block;line-height:1}
.frz{position:fixed;inset:0;z-index:30;background:#3a0b10cc;display:grid;place-items:center;text-align:center;font-size:22px}
.frz b{font-family:Lalezar;font-size:110px;display:block;color:#ffb3b8}
.hintmap{display:flex;gap:6px;justify-content:center;direction:ltr;margin-top:8px}
.hintmap span{width:40px;height:48px;border-radius:8px;background:#f6e2b3;color:#4a2b00;font-family:Lalezar;font-size:30px;display:grid;place-items:center}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick button{border-radius:20px;padding:18px 8px;border:3px solid var(--c);background:#0b3550;display:grid;gap:4px;justify-items:center}
.pick .em{font-size:48px}
.pick .nm{font-size:20px;font-weight:700}
.pick button.taken{opacity:.5}
.trybar{background:#5a3d00;border-bottom:2px solid var(--gold);padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#062234;border:2px solid var(--gold);padding:10px 18px;border-radius:14px;z-index:70;font-weight:700}
/* ================= DISPLAY (broadcast) ================= */
body.dsp{overflow:hidden;background:radial-gradient(140% 100% at 70% 0%,#0f3550 0%,#061626 55%,#030c16 100%) fixed;font-family:Cairo,'IBM Plex Sans Arabic',sans-serif}
.dv{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:14px;padding:16px 20px}
.dv-h{display:flex;align-items:center;gap:18px;justify-content:space-between}
.dv-brand{display:flex;align-items:center;gap:14px}
.dv-logo{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:30px;background:linear-gradient(145deg,#ffd84d,#e0920f);box-shadow:0 6px 18px #f2a91a55,inset 0 2px 0 #fff6}
.dv-brand h1{margin:0;font-family:Lalezar;font-weight:400;font-size:clamp(28px,2.6vw,42px);line-height:1;color:#fff}
.dv-brand small{display:block;color:#7fa8c2;font-size:14px;font-weight:700;margin-top:2px}
.live{display:inline-flex;align-items:center;gap:8px;background:#d7263d;color:#fff;font-weight:900;font-size:14px;padding:5px 12px;border-radius:8px}
.live::before{content:'';width:9px;height:9px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
.live.off{background:#2a3f52;color:#a9c2d4}.live.off::before{animation:none;background:#a9c2d4}
@keyframes blink{50%{opacity:.2}}
.dv-stats{display:flex;gap:10px}
.stat{background:#0b2235cc;border:1px solid #1d4562;border-radius:14px;padding:6px 16px;text-align:center;min-width:110px}
.stat b{display:block;font-size:26px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12px;color:#7fa8c2;font-weight:700}
.dv-tools{display:flex;gap:6px;opacity:.35;transition:opacity .2s}.dv-tools:hover{opacity:1}
.dv-tools button{background:#0b2235;border:1px solid #1d4562;border-radius:10px;padding:6px 10px;font-size:13px}
.dv-m{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(380px,1fr);gap:16px;min-height:0}
.panel{background:linear-gradient(180deg,#0c2438ee,#081a2aee);border:1px solid #1d4562;border-radius:22px;box-shadow:0 20px 50px #0008,inset 0 1px 0 #ffffff10;position:relative;overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px;border-bottom:1px solid #16384f}
.ph h2{margin:0;font-size:18px;font-weight:900;color:#fff;display:flex;gap:8px;align-items:center}
.ph span{color:#7fa8c2;font-size:13px;font-weight:700}
.mapwrap{position:absolute;inset:50px 10px 10px}
.mapwrap svg{width:100%;height:100%;display:block}
.mapwrap .map{border:0;box-shadow:none;border-radius:16px;height:100%}
.alert{position:absolute;top:62px;left:50%;transform:translate(-50%,-30px);opacity:0;transition:.45s cubic-bezier(.2,1.4,.4,1);z-index:5;background:linear-gradient(90deg,#ffd84d,#f2a91a);color:#2b1700;border-radius:16px;padding:10px 22px;font-weight:900;font-size:clamp(18px,1.7vw,26px);box-shadow:0 14px 34px #0009;white-space:nowrap;display:flex;align-items:center;gap:12px}
.alert.on{opacity:1;transform:translate(-50%,0)}
.alert i{font-style:normal;background:#2b1700;color:#ffd84d;border-radius:8px;padding:2px 10px;font-size:14px}
.joinq{position:absolute;bottom:22px;left:22px;z-index:4;background:#fff;color:#062234;border-radius:20px;padding:14px;display:flex;gap:14px;align-items:center;box-shadow:0 16px 40px #000a}
.joinq #qr img,.joinq #qr canvas{display:block}
.joinq b{display:block;font-size:15px}.joinq strong{display:block;font-size:40px;letter-spacing:.12em;direction:ltr;font-weight:900;line-height:1.1}
.joinq span{font-size:13px;color:#3d5a6e;font-weight:700}
.lb{position:relative;margin:10px 14px 14px}
.lr{position:absolute;inset-inline:0;height:var(--rh);transition:top .8s cubic-bezier(.5,0,.2,1),opacity .3s;display:grid;grid-template-columns:54px 64px minmax(0,1fr) auto;align-items:center;gap:12px;padding:0 14px;border-radius:18px;background:linear-gradient(90deg,#0f2d44,#0b2234);border:1px solid #1d4562;overflow:hidden}
.lr::before{content:'';position:absolute;inset-block:0;inset-inline-start:0;width:6px;background:var(--c)}
.lr.r0{background:linear-gradient(90deg,#3a2d08,#0f2d44 60%);border-color:#ffcc3388;box-shadow:0 0 0 1px #ffcc3333,0 10px 30px #ffcc331a}
.lr.idle{opacity:.45}
.rk{font-size:30px;font-weight:900;color:#7fa8c2;text-align:center;font-variant-numeric:tabular-nums}
.lr.r0 .rk{color:#ffcc33}
.av{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:32px;background:#061626;box-shadow:0 0 0 3px var(--c),0 6px 14px #0008}
.who b{display:block;font-size:22px;font-weight:900;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:flex;gap:8px;align-items:center;color:#8fb3ca;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden}
.who small em{font-style:normal;background:#ffcc3322;color:#ffd866;border-radius:6px;padding:0 6px;font-variant-numeric:tabular-nums;direction:ltr}
.trk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:7px}

function onMsg(k,d,local){
  if(!d||d.v!==1)return;
  if(k==='g'){
    if(IS_HOST&&d.hk&&d.hk!==hsh(HK)){IS_HOST=false;toast('رابط المقدم غير صحيح لهذه الغرفة');}
    if(d.sentAt<=G.sentAt&&gotG)return;
    G=d;gotG=true;
    TD=TD.map(t=>t.run===G.run?t:freshT(G.run));
  }else if(/^t[0-3]$/.test(k)){
    if(TRY)return;
    const i=+k[1],cur=TD[i];
    if((d.rev||0)<(cur.rev||0)||((d.rev||0)===(cur.rev||0)&&d.sentAt<=cur.sentAt)){
      if((d.rev||0)<(cur.rev||0)&&(mine(i)||IS_HOST)&&!local)setTimeout(()=>pub('t'+i,TD[i]),300);
      return}
    TD[i]=d;
  }
  saveLocal();soon();
}
function initNet(bi){
  bi=bi||0;if(!ROOM||TRY)return;
  if(!window.mqtt){conn='bad';paintConn();return}
  conn='wait';paintConn();let ok=false,c;
  try{c=mqtt.connect(BROKERS[bi],{clientId:'kz_'+CID+'_'+bi,clean:true,keepalive:30,reconnectPeriod:2500,connectTimeout:8000})}catch(e){if(bi+1<BROKERS.length)initNet(bi+1);return}
  MC=c;
  const fail=setTimeout(()=>{if(!ok&&bi+1<BROKERS.length){try{c.end(true)}catch(e){}initNet(bi+1)}},9000);
  c.on('connect',()=>{ok=true;clearTimeout(fail);conn='ok';paintConn();
    c.subscribe([TOP('g'),TOP('t0'),TOP('t1'),TOP('t2'),TOP('t3')],{qos:1});
    setTimeout(()=>{
      if(IS_HOST&&!G.sentAt){commitG(n=>n)}
      if(MYT!=null&&mine(MYT)&&TD[MYT].sentAt)pub('t'+MYT,TD[MYT]);
    },1500)});
  c.on('reconnect',()=>{conn='wait';paintConn()});
  c.on('offline',()=>{conn='bad';paintConn()});
  c.on('message',(topic,buf)=>{let d;try{d=JSON.parse(String(buf))}catch(e){return}onMsg(topic.slice(topic.lastIndexOf('/')+1),d)});
}

    A.tclose();toast(`🚀 أطلقتم ${TOOLS[ty].n} على ${teamName(j)}!`);[880,660,440,220].forEach((f,x)=>beep(f,.12,'sawtooth',.09,x*.06))},
  'sp-k':d=>{if(frozen())return;if(MS.pin.length<6)MS.pin+=d;$('#spd').textContent='•'.repeat(MS.pin.length);sTick()},
  'sp-clr':()=>{MS.pin='';$('#spd').textContent='····'},
  'sp-ok':()=>{if(frozen())return;if(MS.pin===DEF_PIN)return finishIsland('done');MS.pin='';saveMS();$('#spd').textContent='✗';freeze(5)},
  appr:i=>{i=+i;commitG(n=>{n.appr=Object.assign({},n.appr,{[i]:TD[i].sr})});sOk();toast('✅ تم اعتماد تحدي '+teamName(i))},
  chalsave:()=>{commitG(n=>{n.chal=$('#chalIn').value});toast('تم حفظ التحديات ✓')},
  msgsave:()=>{commitG(n=>{n.msg=$('#msgIn').value});toast('تم حفظ رسالة الكنز ✓')},
  msgdef:()=>{$('#msgIn').value=DEF_MSG},
  showmsg:()=>{view={t:'msg'};dirty()},
  'ch-k':d=>{if(frozen())return;if(MS.inp.length<6)MS.inp+=d;$('#chd').textContent=MS.inp;sTick()},
  'ch-clr':()=>{MS.inp='';$('#chd').textContent='······'},
  'ch-ok':()=>{if(frozen())return;if(MS.inp===digitsFor(MYT).join('')){finishIsland('done')}else{MS.wrong++;MS.inp='';saveMS();dirty();freeze(5)}},
  tryto:k=>{k=+k;view=null;LS.del(SK('ms0')+'-try');MS=null;commitT(0,n=>{n.isl=k;n.st=0;n.sr='';for(let j=k;j<NI;j++)n.res[j]=null});dirty()},
  tryreset:()=>{view=null;LS.del(SK('ms0')+'-try');MS=null;TD[0]=freshT(G.run);TD[0].dev=DEV;dirty()},
  copy:w=>{const t=w==='host'?hostLink():w==='disp'?dispLink():teamLink();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('تم النسخ ✓'),()=>prompt('انسخ الرابط:',t))}
};
document.addEventListener('click',e=>{if(DISPLAY||IS_HOST)initAudio();const el=e.target.closest('[data-act]');if(!el)return;const [a,...rest]=el.dataset.act.split(':');const f=A[a];if(f)f(...rest)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='jcode')A.joinroom()});

/* ======================= TICK ======================= */
let lastSec=-1;
setInterval(()=>{
  if(!ROOM)return;
  paintCountdown();paintFinT();
  if(IS_HOST||DISPLAY){document.querySelectorAll('[data-tm]').forEach(el=>{const i=+el.dataset.tm;el.textContent='⏱ '+fmt(remOf(i))});if(DISPLAY)dvTick();else paintBanner();if(G.view==='fin')renderFinale();return}
  if(MYT!=null&&lastKey==='team'){paintEfx()}
  if(MYT==null||pState()!=='play')return;
  const rem=remOf(MYT);const c=$('#pclk');if(c){c.textContent=fmt(rem);c.classList.toggle('low',rem<30000)}
  const s=Math.ceil(rem/1000);if(s!==lastSec){lastSec=s;if(s<=10&&s>0)sTick()}
  paintFreeze();
  if(!view&&isSurp(TD[MYT].isl)&&G.appr&&G.appr[MYT]&&G.appr[MYT]===TD[MYT].sr)return finishIsland('done');
  if(rem<=0&&!view)finishIsland('timeout');
},250);

let cdLast='';
function paintCountdown(){let el=$('#cdo');const ra=G.raceAt||0,now=Date.now();const on=ra&&now>ra-4600&&now<ra+1300&&G.view!=='fin';
  if(!on){if(el)el.remove();cdLast='';return}
  if(!el){el=document.createElement('div');el.id='cdo';document.body.appendChild(el)}
  const left=Math.ceil((ra-now)/1000);const txt=left>=4?'استعدوا…':left>0?String(left):'أبحروا! ⛵';
  if(txt!==cdLast){cdLast=txt;el.innerHTML=`<b class="${left>0&&left<4?'n':'go'}">${txt}</b>${left>=4?'<span>السباق على وشك الانطلاق</span>':''}`;
    if(left>0&&left<4){beep(440,.25,'square',.12);try{navigator.vibrate&&navigator.vibrate(150)}catch(e){}}
    else if(left<=0){horn();try{navigator.vibrate&&navigator.vibrate([300,100,500])}catch(e){};if(!IS_HOST&&!DISPLAY)soon()}}}
function horn(){if(!AC)return;[[147,1.1],[220,1.1],[294,1.2]].forEach(([f,d])=>beep(f,d,'sawtooth',.09));setTimeout(()=>[523,659,784].forEach((f,i)=>beep(f,.4,'triangle',.12,i*.09)),900)}
/* ======================= CONFETTI ======================= */
let cfRun=0;
function startConfetti(ms){const cv=$('#confetti');cv.hidden=false;const x=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  const P=Array.from({length:160},()=>({x:Math.random()*cv.width,y:-Math.random()*cv.height,s:4+Math.random()*7,v:2+Math.random()*4,a:Math.random()*6,c:['#ffcc33','#ff5a5f','#2fb8ff','#3ee08f','#fff'][Math.floor(Math.random()*5)]}));
  const id=++cfRun;const end=ms?Date.now()+ms:0;
  (function f(){if(id!==cfRun)return;x.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.y+=p.v;p.a+=.08;p.x+=Math.sin(p.a)*1.5;if(p.y>cv.height){p.y=-10;p.x=Math.random()*cv.width}x.fillStyle=p.c;x.fillRect(p.x,p.y,p.s,p.s*.6)});
    if(end&&Date.now()>end){stopConfetti();return}requestAnimationFrame(f)})()}
function stopConfetti(){cfRun++;const cv=$('#confetti');cv.hidden=true}

/* ======================= BOOT ======================= */
if(TRY){G.raceOn=true;TD=[0,1,2,3].map(()=>freshT(G.run));TD[0].dev=DEV;gotG=true}
if(IS_HOST&&!G.hk)G.hk=hsh(HK);
render();initNet();
if(IS_HOST&&!LS.get(SK('g'),null)){setTimeout(()=>{if(!G.sentAt){commitG(n=>n);TD.forEach((t,i)=>send('t'+i,t))}},2500)}
</script>
</body></html>
