:root{--bg:#f6f2ed;--card:#fff;--line:#cdbfb1;--accent:#a58b74;--accent-text:#36424d;--on-accent:#fff;--ink:#26303a;--muted:#68717a;--track:#e9e1d8;--soft:#efe9e2;--wait:#d3c3b3;

 --font:'LatinDigits','IBM Plex Sans Arabic',Tahoma,'Segoe UI',Arial,sans-serif;--display:'LatinDigits','IBM Plex Sans Arabic',Tahoma,'Segoe UI',Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#13181d;--card:#1b2229;--line:#5d5146;--accent:#b69b82;--accent-text:#e2cdb6;--on-accent:#13181d;--ink:#ecebe8;--muted:#9aa3ab;--track:#2a323a;--soft:#222a32;--wait:#59493b;
 --ok:#8fd1a8;--ok-bg:#1d3326;--warn:#e6bd78;--warn-bg:#3a2c14;--bad:#f0a091;--bad-bg:#3b1f1a;color-scheme:dark}.logo{background:#f1ece5;border-radius:14px;padding:8px}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.7;padding:24px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.head{text-align:center}.logo{width:120px;height:auto;display:block;margin:0 auto 6px}
h1{margin:0;font-family:var(--display);font-size:26px;color:var(--accent-text)}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px}
.rule{display:flex;align-items:center;gap:10px;margin:14px 0 0}.rule::before,.rule::after{content:"";flex:1;height:2px;background:var(--accent);opacity:.6}.rule i{width:14px;height:14px;background:var(--accent);clip-path:var(--star)}
main{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
label{display:block;font-weight:600;color:var(--accent-text);margin-bottom:8px}
input{width:100%;padding:13px 14px;font:inherit;font-size:19px;letter-spacing:1px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);text-align:center}
input:focus{outline:2px solid var(--accent-text);outline-offset:1px}
.btn{font:inherit;font-weight:600;font-size:15px;padding:11px 20px;border-radius:10px;border:1px solid var(--accent-text);background:var(--accent-text);color:var(--on-accent);cursor:pointer;width:100%;margin-top:12px}
.btn.ghost{background:transparent;color:var(--accent-text);width:auto;margin:0}
.btn:disabled{opacity:.55;cursor:default}
.msg{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--bad-bg);color:var(--bad);font-size:14px}
.hint{margin:10px 0 0;color:var(--muted);font-size:13px}
h2{margin:0 0 12px;font-family:var(--display);font-size:19px;color:var(--accent-text)}
.who h2{font-size:23px;margin:0}.who p{margin:2px 0 0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stats div{background:var(--soft);border-radius:10px;padding:12px 6px;text-align:center}
.stats b{display:block;font-size:24px;line-height:1.2;color:var(--accent-text);font-variant-numeric:tabular-nums}.stats span{font-size:12.5px;color:var(--muted)}
.cmp{margin-bottom:16px}.cmp h3{margin:0 0 6px;font-size:15px;color:var(--ink)}
.row{display:grid;grid-template-columns:92px 1fr 52px;gap:8px;align-items:center;margin:4px 0;font-size:13.5px}
.bar{height:10px;background:var(--track);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent-text))}.bar.h i{background:var(--wait)}
.row b{font-variant-numeric:tabular-nums;text-align:end}
.verdict{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.next{background:var(--soft);border-radius:10px;padding:12px 14px;margin:0 0 8px}.next b{color:var(--accent-text)}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
th{background:var(--soft);color:var(--accent-text);padding:9px 8px;border-bottom:2px solid var(--accent);white-space:nowrap}
td{padding:9px 8px;text-align:center;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}td.w{text-align:right;min-width:150px}
.pill{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12.5px;background:var(--soft);color:var(--accent-text)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
.foot{text-align:center;color:var(--muted);font-size:12.5px}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:78px 1fr 48px}}
